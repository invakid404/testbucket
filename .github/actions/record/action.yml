name: testbucket record
description: >-
  Install testbucket, AUDIT a finished run against the plan it was fanned out
  from (every scheduled target actually reported), then INGEST the measured
  timings into the store so the next split is better than this one. Intended to
  run only on the trunk branch, where the store is authoritative.

inputs:
  runner:
    description: 'Test-runner adapter: go or vitest.'
    default: go
  k:
    description: 'The same k the plan used; --whale-k is derived from it.'
    default: "6"
  count:
    description: 'The -count the measured run swept at (aggregate across shards).'
    default: "1"
  store-path:
    description: 'Timing-store JSON to create or update.'
    default: test-timings.json
  events-dir:
    description: 'Directory holding the downloaded per-bucket event files.'
    default: /tmp/testbucket-events
  shard-plan:
    description: 'The downloaded shard-plan JSON the run was fanned out from (for the audit).'
    default: /tmp/testbucket-shard-plan.json
  version:
    description: >-
      testbucket binary to install: a moving `vX`/`vX.Y` alias, an exact
      `vX.Y.Z`, or "local" to build from the checked-out source. The default is
      the moving `v0` alias, which resolves to the highest published 0.x
      release — this project is deliberately pre-1.0. A scored arm must pin an
      exact `vX.Y.Z` instead: an alias is descriptive metadata, not a delivery
      identity.
    default: v0
  working-directory:
    description: 'Directory to run in (discovery for pruning walks up from here).'
    default: "."
  vitest-command:
    description: 'How to invoke vitest (--runner vitest) for the ingest''s discovery; empty means "npx vitest". Ignored for the Go runner.'
    default: ""
  exclude-module:
    description: >-
      Module dirs (globs) to leave out of the ingest's stale-row pruning
      discovery, one per line; repeatable, replaces the tool's empty default.
      Set this to the SAME value the plan used so pruning sees the same module
      set. Empty = every module under the working directory is in scope.
    default: ""

  # --- contract §21 added inputs -------------------------------------------
  wall-observations-dir:
    description: >-
      Directory of downloaded wall observations for `ingest --wall-observations`
      to read. R54 uploaded a wall artifact that nothing downloaded; this input
      and the same-run download beside it close that end of the loop
      (§14.1, §14.2).
    default: ""
  campaign-config-json:
    description: >-
      The frozen §19.9a campaign config as CONTENT, not a pathname: a record
      runner's path is not a shared filesystem. Required iff the ingested set
      contains a scored or pilot row.
    default: ""
  campaign-config-digest-expected:
    description: >-
      Expected SHA-256 of that content. §19.9c-1 materializes and verifies the
      bytes job-locally and fails BEFORE invoking `ingest`, then passes the
      local path to `ingest --campaign-config` so `trainable` is set at append.
      A perturbation of either the bytes or this digest fails independently.
    default: ""
runs:
  using: composite
  steps:
    # --- §19.9c-1: materialize and VERIFY the campaign config ---------------
    #
    # The config crosses the boundary as CONTENT plus an expected digest,
    # because a record-runner path is not a shared filesystem. The bytes are
    # written job-locally and the digest recomputed over what was actually
    # written, and the job fails BEFORE invoking `ingest` on any mismatch — so
    # no row is appended, no selected identity or model byte changes, and the
    # fitter is never called. The two perturbations fail independently: bytes
    # changed with the digest held, and digest changed with the bytes held.
    - name: Materialize and verify the campaign config
      id: campaign-config
      if: inputs.campaign-config-json != ''
      shell: bash
      env:
        TB_CFG_JSON: ${{ inputs.campaign-config-json }}
        TB_CFG_EXPECTED: ${{ inputs.campaign-config-digest-expected }}
      run: |
        set -euo pipefail
        if [ -z "$TB_CFG_EXPECTED" ]; then
          echo "campaign-config-json supplied without campaign-config-digest-expected" >&2
          exit 1
        fi
        dest="${{ runner.temp }}/campaign-config.json"
        # printf, not echo: the config is canonical JSON and a shell that
        # expanded escapes would change the very bytes the digest covers.
        printf '%s' "$TB_CFG_JSON" > "$dest"
        actual=$(sha256sum "$dest" | cut -d' ' -f1)
        if [ "$actual" != "$TB_CFG_EXPECTED" ]; then
          echo "campaign config digest mismatch: materialized $actual, expected $TB_CFG_EXPECTED" >&2
          exit 1
        fi
        echo "file=$dest" >> "$GITHUB_OUTPUT"
        echo "digest=$actual" >> "$GITHUB_OUTPUT"

    # THE PRE-INGEST CAMPAIGN-ID REFUSAL IS REMOVED.
    #
    # It read `inputs.campaign-id`, which this action does not declare and the
    # record job does not pass — the component map gives record
    # wall-observations-dir and the two campaign-config inputs, and no campaign
    # identity. The condition was therefore always false: a guard that cannot
    # fire, with a test asserting coverage that did not exist.
    #
    # The property itself is real and is enforced where it CAN be: §15.1b's
    # TrainableAtAppend refuses, before append, any observation carrying a
    # campaign_id with no verified config. That runs against the rows ingest
    # actually parses rather than against an input nobody supplies.

    - name: Install testbucket
      shell: bash
      env:
        TB_VERSION: ${{ inputs.version }}
        TB_REPO: invakid404/testbucket
        TB_BINDIR: ${{ runner.temp }}/testbucket-bin
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/../install-testbucket.sh"

    - name: Audit, then ingest the measured timings
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TB_WALL_OBSERVATIONS: ${{ inputs.wall-observations-dir }}
        TB_CAMPAIGN_CONFIG: ${{ steps.campaign-config.outputs.file }}
        TB_CAMPAIGN_CONFIG_DIGEST_EXPECTED: ${{ steps.campaign-config.outputs.digest }}
        TB_RUNNER: ${{ inputs.runner }}
        TB_K: ${{ inputs.k }}
        TB_COUNT: ${{ inputs.count }}
        TB_STORE: ${{ inputs.store-path }}
        TB_EVENTS_DIR: ${{ inputs.events-dir }}
        TB_SHARD_PLAN: ${{ inputs.shard-plan }}
        TB_VITEST_COMMAND: ${{ inputs.vitest-command }}
        TB_EXCLUDE_MODULE: ${{ inputs.exclude-module }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$TB_STORE")"

        # Event files differ by adapter: the Go runner tees `.ndjson`, the Vitest
        # runner writes a `.json` report per bucket.
        shopt -s nullglob
        if [ "$TB_RUNNER" = "go" ]; then
          events=("$TB_EVENTS_DIR"/*.ndjson)
        else
          events=("$TB_EVENTS_DIR"/*.json)
        fi
        if [ ${#events[@]} -eq 0 ]; then
          echo "no timing events found in $TB_EVENTS_DIR; nothing to record" >&2
          exit 1
        fi

        # The plan's coverage gate proved the MATRIX was complete before anything
        # ran; the audit proves the RUN was — a bucket that produced no events, an
        # artifact that failed to upload, a shard that died before reporting are
        # all invisible to a gate that only ever saw the plan.
        echo "auditing ${#events[@]} event file(s) against the plan"
        testbucket audit --runner "$TB_RUNNER" --shard-plan "$TB_SHARD_PLAN" "${events[@]}"

        # A vitest command override is passed as one properly-quoted argument so
        # a multi-word command survives with its grouping intact.
        extra=()
        if [ -n "$TB_VITEST_COMMAND" ]; then
          extra+=(--vitest-command "$TB_VITEST_COMMAND")
        fi

        # exclude-module scopes the ingest's stale-row pruning discovery to the
        # same module set the plan used; one glob per line, each its own
        # repeatable flag. Blank lines are skipped. (audit above needs no scope —
        # it reconciles events against the already-scoped shard-plan.)
        while IFS= read -r mod; do
          [ -n "$mod" ] && extra+=(--exclude-module "$mod")
        done <<< "$TB_EXCLUDE_MODULE"

        # A sharded unit reports once per shard; ingest sums the per-unit weight
        # back into a whole-unit measurement, so the store keeps measuring units
        # however the matrix happened to slice them. --whale-k is the plan's k.
        echo "ingesting into $TB_STORE"
        # §14.2's two added flags. --wall-observations is the directory the
        # same-run artifact download left; --campaign-config is the LOCAL path
        # the verify step above produced, never the caller's content, so an
        # unverified config cannot reach append.
        if [ -n "${TB_WALL_OBSERVATIONS:-}" ]; then
          extra+=(--wall-observations "$TB_WALL_OBSERVATIONS")
        fi
        if [ -n "${TB_CAMPAIGN_CONFIG:-}" ]; then
          extra+=(--campaign-config "$TB_CAMPAIGN_CONFIG")
        fi

        testbucket ingest \
          --runner "$TB_RUNNER" \
          --store "$TB_STORE" \
          --count "$TB_COUNT" \
          --whale-k "$TB_K" \
          "${extra[@]}" \
          "${events[@]}"

        # Best-effort split evidence: why each candidate did or didn't divide.
        # Never fail the record over a reporting extra.
        echo "--- split decisions on the recorded store ---"
        testbucket whales --k "$TB_K" --store "$TB_STORE" || true
