name: testbucket record
description: >-
  Install testbucket, AUDIT a finished run against the plan it was fanned out
  from (every scheduled target actually reported), then INGEST the measured
  timings into the store so the next split is better than this one. Intended to
  run only on the trunk branch, where the store is authoritative.

inputs:
  runner:
    description: 'Test-runner adapter: go or vitest.'
    default: go
  k:
    description: 'The same k the plan used; --whale-k is derived from it.'
    default: "6"
  count:
    description: 'The -count the measured run swept at (aggregate across shards).'
    default: "1"
  store-path:
    description: 'Timing-store JSON to create or update.'
    default: test-timings.json
  events-dir:
    description: 'Directory holding the downloaded per-bucket event files.'
    default: /tmp/testbucket-events
  shard-plan:
    description: 'The downloaded shard-plan JSON the run was fanned out from (for the audit).'
    default: /tmp/testbucket-shard-plan.json
  version:
    description: >-
      testbucket binary to install: a moving `vX`/`vX.Y` alias, an exact
      `vX.Y.Z`, or "local" to build from the checked-out source. The default is
      the moving `v0` alias, which resolves to the highest published 0.x
      release — this project is deliberately pre-1.0. A scored arm must pin an
      exact `vX.Y.Z` instead: an alias is descriptive metadata, not a delivery
      identity.
    default: v0
  release-pins-ref:
    description: >-
      Full 40-hex commit SHA of this repository carrying the precommitted
      binary digest for a release published AFTER this action's own commit.

      A release cannot contain its own digest: GoReleaser embeds the tag commit
      and its timestamp in the binary, so the hash cannot exist before the tag
      that produces it. The colocated pin file therefore covers releases
      published earlier, and the newest one is pinned by the commit that comes
      after it — proposed by the `pin-release` workflow and merged under review.
      Only a full commit SHA is accepted: a branch or a tag would put the pin
      back under the control of whoever can move that ref.
    default: ""
  candidate-binary-digest:
    description: >-
      The `sha256:<64-hex>` of the testbucket BINARY the campaign authorised,
      as the signed Stage-1 manifest binds it. REQUIRED whenever `version` is a
      `candidate:<run-id>/<artifact>@sha256:<64-hex>` pin: the archive digest
      says which archive was downloaded, this says which binary is about to
      execute, and Stage 1 binds the second. Do not type it in. Derive it with
      `testbucket wall stage1-binary --file stage1.json` run from a PUBLISHED
      release — that command validates the manifest, so the value comes from
      the builder's attestation, the verifier's countersignature and the
      campaign authority's own signature rather than from whoever wired the
      job. Empty for a published release, whose bytes are checksum-verified
      against the release manifest instead.
    default: ""
  working-directory:
    description: 'Directory to run in (discovery for pruning walks up from here).'
    default: "."
  vitest-command:
    description: 'How to invoke vitest (--runner vitest) for the ingest''s discovery; empty means "npx vitest". Ignored for the Go runner.'
    default: ""
  exclude-module:
    description: >-
      Module dirs (globs) to leave out of the ingest's stale-row pruning
      discovery, one per line; repeatable, replaces the tool's empty default.
      Set this to the SAME value the plan used so pruning sees the same module
      set. Empty = every module under the working directory is in scope.
    default: ""

runs:
  using: composite
  steps:
    - name: Install testbucket
      shell: bash
      env:
        TB_VERSION: ${{ inputs.version }}
        TB_CANDIDATE_BINARY_DIGEST: ${{ inputs.candidate-binary-digest }}
        TB_RELEASE_PINS_REF: ${{ inputs.release-pins-ref }}
        TB_REPO: invakid404/testbucket
        TB_BINDIR: ${{ runner.temp }}/testbucket-bin
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/../install-testbucket.sh"

    - name: Audit, then ingest the measured timings
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TB_RUNNER: ${{ inputs.runner }}
        TB_K: ${{ inputs.k }}
        TB_COUNT: ${{ inputs.count }}
        TB_STORE: ${{ inputs.store-path }}
        TB_EVENTS_DIR: ${{ inputs.events-dir }}
        TB_SHARD_PLAN: ${{ inputs.shard-plan }}
        TB_VITEST_COMMAND: ${{ inputs.vitest-command }}
        TB_EXCLUDE_MODULE: ${{ inputs.exclude-module }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$TB_STORE")"

        # Event files differ by adapter: the Go runner tees `.ndjson`, the Vitest
        # runner writes a `.json` report per bucket.
        shopt -s nullglob
        if [ "$TB_RUNNER" = "go" ]; then
          events=("$TB_EVENTS_DIR"/*.ndjson)
        else
          events=("$TB_EVENTS_DIR"/*.json)
        fi
        if [ ${#events[@]} -eq 0 ]; then
          echo "no timing events found in $TB_EVENTS_DIR; nothing to record" >&2
          exit 1
        fi

        # The plan's coverage gate proved the MATRIX was complete before anything
        # ran; the audit proves the RUN was — a bucket that produced no events, an
        # artifact that failed to upload, a shard that died before reporting are
        # all invisible to a gate that only ever saw the plan.
        echo "auditing ${#events[@]} event file(s) against the plan"
        testbucket audit --runner "$TB_RUNNER" --shard-plan "$TB_SHARD_PLAN" "${events[@]}"

        # A vitest command override is passed as one properly-quoted argument so
        # a multi-word command survives with its grouping intact.
        extra=()
        if [ -n "$TB_VITEST_COMMAND" ]; then
          extra+=(--vitest-command "$TB_VITEST_COMMAND")
        fi

        # exclude-module scopes the ingest's stale-row pruning discovery to the
        # same module set the plan used; one glob per line, each its own
        # repeatable flag. Blank lines are skipped. (audit above needs no scope —
        # it reconciles events against the already-scoped shard-plan.)
        while IFS= read -r mod; do
          [ -n "$mod" ] && extra+=(--exclude-module "$mod")
        done <<< "$TB_EXCLUDE_MODULE"

        # A sharded unit reports once per shard; ingest sums the per-unit weight
        # back into a whole-unit measurement, so the store keeps measuring units
        # however the matrix happened to slice them. --whale-k is the plan's k.
        echo "ingesting into $TB_STORE"
        testbucket ingest \
          --runner "$TB_RUNNER" \
          --store "$TB_STORE" \
          --count "$TB_COUNT" \
          --whale-k "$TB_K" \
          "${extra[@]}" \
          "${events[@]}"

        # Best-effort split evidence: why each candidate did or didn't divide.
        # Never fail the record over a reporting extra.
        echo "--- split decisions on the recorded store ---"
        testbucket whales --k "$TB_K" --store "$TB_STORE" || true
