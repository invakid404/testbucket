name: testbucket run-bucket
description: >-
  Install testbucket and run one planned bucket. The bucket's generated script
  tees machine-readable timing events for a later ingest; this action renders a
  human-readable log alongside and exits with the SCRIPT's status, never the
  renderer's — a happy renderer must not make a red bucket look green.

inputs:
  runner:
    description: 'Test-runner adapter: go or vitest.'
    default: go
  script:
    description: 'The bucket''s generated script (matrix.script).'
    required: true
  name:
    description: 'Human label for the bucket (matrix.name).'
    default: bucket
  est-seconds:
    description: >-
      The bucket's estimate in seconds, from `matrix.est_seconds`. Its MEANING
      is given by `est_basis` (§16.4): under `reporter` it is the bucket's
      reporter-work sum, and under `wall` it is `round1(A_eta_ns/1e9)` of the
      model's objective. It is never the job's wall time — the job is not
      measured.
    default: ""
  events-dir:
    description: >-
      Absolute directory the generated script tees its events into. Must match
      the events-dir the plan baked into the script; this action creates it
      before the run so the script's `tee` has somewhere to write.
    default: /tmp/testbucket-events
  version:
    description: >-
      testbucket binary to install: a moving `vX`/`vX.Y` alias, an exact
      `vX.Y.Z`, or "local" to build from the checked-out source. The default is
      the moving `v0` alias, which resolves to the highest published 0.x
      release — this project is deliberately pre-1.0. A scored arm must pin an
      exact `vX.Y.Z` instead: an alias is descriptive metadata, not a delivery
      identity. A scored row requires an
      exact `vX.Y.Z`.
    default: v0
  working-directory:
    description: 'Directory to run the bucket in.'
    default: "."
  setup-command:
    description: >-
      Optional shell command run once per bucket job, in the working-directory,
      BEFORE the rendered test command — a first-class seam for a consumer's own
      per-runner provisioning (DB binaries, codegen, toolchains). Runs as a bash
      block; a failure fails the bucket before any test runs. Empty = no setup
      step ⇒ unchanged behavior.

      UNDER MEASUREMENT it runs through `wall run`, which strips both the
      wall-time capabilities and the GitHub file-command channels
      ($GITHUB_OUTPUT, $GITHUB_ENV, $GITHUB_PATH, $GITHUB_STEP_SUMMARY,
      $GITHUB_STATE) from its environment. A setup command that sets step
      outputs or job-wide variables therefore has no effect on a measured
      bucket: those channels are how the signer delegate reaches the measured
      step, and consumer-supplied code must not be able to read or write them.
      Do that provisioning in a prior step of the caller's own job instead.
    default: ""
  wall-time-dir:
    description: >-
      Optional records directory for complete-action wall-time measurement
      (--runner vitest). When set, the whole action runs inside a physical
      envelope with its own containment peer and independent trace: `wall begin`
      opens it before setup, the setup command and the bucket script run inside
      the action containment, and `wall end` closes it after verified-empty
      containment. It MUST match the --wall-dir the plan baked into the script.
      Empty = no measurement ⇒ byte-identical behavior to before.
    default: ""
  campaign-id:
    description: 'Campaign identity stamped on every record.'
    default: ""
  # --- contract §21 added inputs -------------------------------------------
  runs-on-label:
    description: >-
      The same label the caller passed to `plan`. Recorded into the observation
      as observed_runs_on_label and compared against the key's
      runner_image_label by QC12; a divergence is a reported misconfiguration,
      not silent tolerance. Required non-empty for a scored run.
    default: ""
  cache-declaration-file:
    description: >-
      Job-local file this matrix job materialized from the plan job's
      `cache-declaration-json` output — the immutable plan-time declaration of
      §10.5.0. run-bucket verifies its digest, copies the declaration leaves
      verbatim into the observation, and then fills every leaf §10.5.0 classes
      as an outcome. Required for a scored run (AD-9).
    default: ""
  cache-declaration-digest:
    description: >-
      The SHA-256 the plan job published. run-bucket recomputes it over the
      materialized bytes and fails the job on any difference, before the bucket
      script starts. Required for a scored run (AD-9).
    default: ""
  dependency-cache-producer:
    description: >-
      Exactly `none`, `action` or `caller` — the wire representation of
      §10.5.3's "the workflow declares which". `none` is required when the
      declared mode is `disabled` and illegal otherwise; `action` and `caller`
      are legal only under `exact-key`. Required for a scored run.
    default: ""
  dependency-cache-matched-key:
    description: >-
      The caller's restore step's matched key, possibly empty. Required
      (possibly empty) iff the producer is `caller`, and must be ABSENT under
      `action` and `none` — supplying it under another producer fails the job
      rather than being silently resolved.
    default: ""
  dependency-cache-hit:
    description: >-
      The caller's restore result, `true` or `false`. A tri-state is not
      permitted and empty is not false: an empty matched key WITH a false hit
      is a caller-owned miss, while an empty matched key WITHOUT a hit is
      absent producer data, and before this input existed the two were
      indistinguishable. Required non-empty iff the producer is `caller`.
    default: ""
  candidate-sha:
    description: >-
      Written into the observation as candidate_sha, one of the three separate
      provenance identities QC15 requires. Required for a scored run.
    default: ""
  workload-commit:
    description: >-
      Written into the observation as workload_commit, likewise. Required for a
      scored run.
    default: ""
  shard-plan:
    description: >-
      The plan job's shard-plan output, carrying the canonical `profile` block
      that is copied verbatim into the observation so QC13 has a real byte
      path. Required for a scored run.
    default: ""
runs:
  using: composite
  steps:
    - name: Install testbucket
      if: inputs.runner == 'go' && inputs.wall-time-dir == ''
      shell: bash
      env:
        TB_VERSION: ${{ inputs.version }}
        TB_REPO: invakid404/testbucket
        TB_BINDIR: ${{ runner.temp }}/testbucket-bin
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/../install-testbucket.sh"

    # AT_start. This is the FIRST action-owned operation, and it is first in
    # the step list for that reason: the containment, the two observer
    # processes and their admission handshakes are all real action time, and
    # anything this action did before them would be action-owned work outside
    # the interval that claims to contain it.
    #
    # The wrapper must therefore already be on PATH — a measured caller runs
    # the `install` action first. A missing wrapper fails here, before the
    # envelope opens, which is a precondition rather than unmeasured work.
    - name: Open the wall-time action envelope
      if: inputs.wall-time-dir != ''
      shell: bash
      env:
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
        BUCKET_NAME: ${{ inputs.name }}
        TB_CAMPAIGN_ID: ${{ inputs.campaign-id }}
      run: |
        set -euo pipefail
        # The records directory is created by `wall begin` itself, INSIDE the
        # envelope: creating it here would put action-owned work before
        # AT_start and report an action shorter than the one that ran.
        testbucket wall begin \
          --dir "$TB_WALL_DIR" \
          --bucket-id "$BUCKET_NAME" \
          --campaign-id "$TB_CAMPAIGN_ID" \
          --run-id "${GITHUB_RUN_ID:-}" \
          --attempt-id "${GITHUB_RUN_ATTEMPT:-}" \
          --repository "${GITHUB_REPOSITORY:-}" \
          --workflow-run "${GITHUB_RUN_ID:-}" \
          --job "${GITHUB_JOB:-}" \
          --step "run-bucket" \
          --step-attempt "${GITHUB_RUN_ATTEMPT:-}"

    # A consumer's own per-runner provisioning, run once before the bucket's test
    # command. Passed through the environment and executed as a bash block (never
    # spliced into the command line): the command is consumer-supplied data, and
    # splicing it into a run: line is how a workflow grows an injection. `-e` so a
    # failed provisioning step fails the bucket instead of leaking into the tests.
    #
    # Under measurement it runs through `wall run`, which admits it to the ACTION
    # containment first: setup is real action-owned work, and work outside the
    # containment is work the trace cannot see.
    # THE ACTION-OWNED PRECHECKS RUN INSIDE THE ENVELOPE.
    #
    # They used to run BEFORE `wall begin`. §3.2 lists what may sit outside A
    # -- the wrapper install, the closing record write, the directory seal --
    # and these are not on it: verifying the declaration, validating the
    # producer and hashing the executed MongoDB binary are action-owned work,
    # so an interval that excluded them was not the complete run-bucket action
    # it reported.
    #
    # They still gate the bucket: a declaration that arrived altered fails
    # here, before the setup command and the generated script, and now does so
    # as a retained terminal record inside the envelope rather than as a step
    # that vanished before the envelope existed.

    # --- §10.5.2 step 4: VERIFY the materialized declaration -----------------
    #
    # The bytes were published by the plan job and written to a job-local file
    # by this matrix job. Recomputing the digest here is what makes cross-job
    # byte identity a CHECKED property rather than an assertion about a shared
    # pathname — two jobs on two runners share no filesystem. A declaration
    # that arrived altered fails HERE, before any bucket script starts, so it
    # can never reach QC14 as a silent difference.
    - name: Verify the cache declaration
      if: inputs.cache-declaration-file != ''
      shell: bash
      env:
        TB_DECL_FILE: ${{ inputs.cache-declaration-file }}
        TB_DECL_DIGEST: ${{ inputs.cache-declaration-digest }}
      run: |
        set -euo pipefail
        if [ ! -f "$TB_DECL_FILE" ]; then
          echo "cache-declaration-file $TB_DECL_FILE does not exist on this runner" >&2
          exit 1
        fi
        if [ -z "$TB_DECL_DIGEST" ]; then
          echo "cache-declaration-file supplied without cache-declaration-digest" >&2
          exit 1
        fi
        actual=$(sha256sum "$TB_DECL_FILE" | cut -d' ' -f1)
        if [ "$actual" != "$TB_DECL_DIGEST" ]; then
          echo "cache declaration digest mismatch: materialized $actual, plan published $TB_DECL_DIGEST" >&2
          exit 1
        fi

    # --- §10.5.3: the producer state machine, before the script starts -------
    #
    # Every legal mode has exactly one legal producer state, and the companion
    # inputs are required IFF the producer is `caller`. Supplying two producers
    # is rejected rather than silently resolved in favour of one, and an empty
    # `dependency-cache-hit` is NOT false — an empty matched key WITH a false
    # hit is a caller-owned miss, while an empty matched key WITHOUT a hit is
    # absent producer data, and the two must stay distinguishable.
    - name: Validate the dependency-cache producer
      if: inputs.cache-declaration-file != ''
      shell: bash
      env:
        TB_PRODUCER: ${{ inputs.dependency-cache-producer }}
        TB_MATCHED: ${{ inputs.dependency-cache-matched-key }}
        TB_HIT: ${{ inputs.dependency-cache-hit }}
        TB_DECL_FILE: ${{ inputs.cache-declaration-file }}
      run: |
        set -euo pipefail
        case "$TB_PRODUCER" in
          none|action|caller) ;;
          "") echo "dependency-cache-producer is required whenever a cache declaration is supplied" >&2; exit 1 ;;
          *)  echo "dependency-cache-producer is \"$TB_PRODUCER\"; it must be none, action or caller" >&2; exit 1 ;;
        esac

        # The declared mode decides which producer is legal.
        mode=$(grep -o '"dependency_cache_mode":"[^"]*"' "$TB_DECL_FILE" | head -1 | cut -d'"' -f4)
        case "$mode" in
          disabled)
            if [ "$TB_PRODUCER" != "none" ]; then
              echo "declared mode disabled requires dependency-cache-producer none, got $TB_PRODUCER" >&2
              exit 1
            fi ;;
          exact-key)
            if [ "$TB_PRODUCER" = "none" ]; then
              echo "declared mode exact-key requires a producer; none is illegal there" >&2
              exit 1
            fi ;;
          *)
            echo "declared dependency_cache_mode is \"$mode\"; only disabled and exact-key are legal" >&2
            exit 1 ;;
        esac

        if [ "$TB_PRODUCER" = "caller" ]; then
          # Both companions required; the HIT must be a literal true or false,
          # because empty is not false.
          if [ -z "${TB_HIT}" ]; then
            echo "producer caller requires dependency-cache-hit; empty is not false" >&2
            exit 1
          fi
          if [ "$TB_HIT" != "true" ] && [ "$TB_HIT" != "false" ]; then
            echo "dependency-cache-hit is \"$TB_HIT\"; it is true or false and nothing else" >&2
            exit 1
          fi
          if [ "$TB_HIT" = "true" ] && [ -z "$TB_MATCHED" ]; then
            echo "incoherent producer result: hit true with an empty matched key" >&2
            exit 1
          fi
          if [ "$TB_HIT" = "false" ] && [ -n "$TB_MATCHED" ]; then
            echo "incoherent producer result: hit false with a non-empty matched key" >&2
            exit 1
          fi
        else
          # Under `action` and `none` BOTH companions must be absent —
          # supplying them is two producers, which is rejected.
          if [ -n "$TB_MATCHED" ] || [ -n "$TB_HIT" ]; then
            echo "producer $TB_PRODUCER with a companion input present: supplying two producers is rejected" >&2
            exit 1
          fi
        fi

    # --- QC14a: the hashed binary is the EXECUTED binary --------------------
    #
    # On the bucket runner, before artifact upload. The digest is taken over
    # the file MONGOMS_SYSTEM_BINARY names, so a decoy resident elsewhere
    # cannot be hashed in its place — even one whose digest happens to equal
    # the declared expectation.
    - name: QC14a — bind the executed MongoDB binary
      if: inputs.cache-declaration-file != ''
      shell: bash
      env:
        TB_DECL_FILE: ${{ inputs.cache-declaration-file }}
      run: |
        set -euo pipefail
        if [ -z "${MONGOMS_SYSTEM_BINARY:-}" ]; then
          echo "QC14a: MONGOMS_SYSTEM_BINARY is unset or empty; the declared binary cannot be bound to the one that ran" >&2
          exit 1
        fi
        if [ ! -f "$MONGOMS_SYSTEM_BINARY" ]; then
          echo "QC14a: MONGOMS_SYSTEM_BINARY names $MONGOMS_SYSTEM_BINARY, which is not a file" >&2
          exit 1
        fi
        executed=$(sha256sum "$MONGOMS_SYSTEM_BINARY" | cut -d' ' -f1)
        expected=$(grep -o '"expected_mongo_binary_sha256":"[^"]*"' "$TB_DECL_FILE" | head -1 | cut -d'"' -f4)
        expected=${expected#sha256:}
        if [ -n "$expected" ] && [ "$executed" != "$expected" ]; then
          echo "QC14a: executed binary $MONGOMS_SYSTEM_BINARY digests to $executed, declaration expects $expected" >&2
          exit 1
        fi
        echo "QC14a: executed binary $MONGOMS_SYSTEM_BINARY verified on this runner"

    # The Go runner needs the binary for `testbucket render`; a Vitest bucket's
    # script prints its own default-reporter log, so it needs no binary.
    #
    # A MEASURED bucket needs it too — and must NOT install it here. The
    # physical action envelope opens on the first action-owned operation, and
    # the wrapper cannot read a clock before it exists, so installing inside
    # this action would put action-owned work before AT_start permanently. A
    # measured caller runs the `install` action first; the envelope step below
    # is then this action's first operation.
    - name: Set up the bucket
      if: inputs.setup-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TB_SETUP_COMMAND: ${{ inputs.setup-command }}
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
        # The account the MEASURED WORK runs under. The wrapper stays as this
        # step's user, which may write the delegated subtree; the measured
        # command is executed as this account, which may not. Empty means no
        # boundary was established, and the row is recorded in full and
        # reported INELIGIBLE rather than scored.
      run: |
        set -euo pipefail
        if [ -n "$TB_WALL_DIR" ]; then
          # NO --wrapper-chain: this is the CONSUMER'S command. `wall run`
          # strips every wall-time secret and account selector from its child,
          # so caller-supplied code never runs holding the signer delegate or
          # anything else that could decide whose evidence a run admits.
          testbucket wall run --dir "$TB_WALL_DIR" -- bash -eo pipefail -c "$TB_SETUP_COMMAND"
        else
          bash -eo pipefail -c "$TB_SETUP_COMMAND"
        fi

    - name: Run the bucket
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Passed through the environment and quoted on use rather than
        # interpolated into the shell: the script is generated data, and
        # splicing generated text into a command line is how a workflow grows an
        # injection.
        TB_RUNNER: ${{ inputs.runner }}
        BUCKET_SCRIPT: ${{ inputs.script }}
        BUCKET_NAME: ${{ inputs.name }}
        BUCKET_EST: ${{ inputs.est-seconds }}
        TB_EVENTS_DIR: ${{ inputs.events-dir }}
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
        # The account the MEASURED WORK runs under. The wrapper stays as this
        # step's user, which may write the delegated subtree; the measured
        # command is executed as this account, which may not. Empty means no
        # boundary was established, and the row is recorded in full and
        # reported INELIGIBLE rather than scored.
        # The bucket script's own account. The wrapper drops to it before
        # starting the script, so the measured script is not the credential
        # owning what contains it; the invocation containments beneath it are
        # created by the wrapper's controller rather than by the script.
        # THE SIGNER DELEGATE, NAMED BY THE ONE STEP THAT NEEDS IT.
        #
        # This is the only step that references the begin step's output, so it
        # is the only step whose environment carries the capability. The
        # consumer-supplied setup step above does not name it, and `wall run`
        # strips it from that child's environment as well — two independent
        # reasons caller-controlled code cannot hold it.
        TB_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Under measurement, EVERYTHING this step owns runs inside one
        # `wall run`, which admits itself to the action containment before
        # spawning its child — so the child, and everything the child starts,
        # inherits that cgroup.
        #
        # Preparing here and wrapping only the script would not work: this
        # Actions shell is already running, `wall run` moves only its own
        # process, and a child cannot retroactively admit its parent. The
        # preparation would sit inside A's clock interval while the peer and
        # the trace never saw it.
        #
        # The measured body is single-quoted, so the generated script is never
        # spliced into a command line; the inner shell reads it from the
        # environment, exactly as the unmeasured path does.
        # THE CREDENTIAL DROPS HAPPEN INSIDE THE WRAPPER, at both measured
        # levels. This shell must not wrap anything: the wrapper chain needs
        # the credential that can create and admit containments and write the
        # evidence directory, and each measured process tree drops from it —
        # the bucket script to TB_WALL_SCRIPT_USER, the test code inside each
        # invocation to TB_WALL_WORKLOAD_USER.
        #
        # A guard here used to build a `sudo` prefix from two variables that no
        # longer exist — one belonging to the removed supervisor, one never
        # exported at all — so it was always empty and the drop never happened
        # anywhere. Dead wiring that reads like a boundary is worse than none.
        if [ -n "$TB_WALL_DIR" ]; then
          set +e
          # --wrapper-chain: this child IS the wrapper chain. The script-level
          # wrapper it starts registers its own producers and its controller
          # registers the invocation ones, so it needs the capabilities the
          # setup command must not have.
          testbucket wall run --dir "$TB_WALL_DIR" --wrapper-chain -- bash -euo pipefail -c '
            # THE SCORED DELIVERY-IDENTITY GATE IS REMOVED.
            #
            # It read "$TB_SCORED" under `set -u` in a shell that never
            # exported it, from an action that declares no `scored` input --
            # so every measured bucket terminated on an unbound variable
            # before the generated script ran. The measured path was dead in
            # the shipped candidate, and the workflow tests did not catch it
            # because they scan this file for step names and phrases instead
            # of executing it.
            #
            # It was also stale on its own terms: it gated a scored run on an
            # exact release tag or a digest-pinned pre-publication candidate,
            # and the candidate delivery cycle is one of the surfaces the
            # practical component map removes from this action.

            # The generated script tees its events into this directory; create
            # it first so `tee` has somewhere to write (the script itself does
            # not mkdir, and each bucket runs on a fresh runner).
            mkdir -p "$TB_EVENTS_DIR"
            # DELEGATED THE SAME WAY THE EVIDENCE DIRECTORY IS: the measured
            # script runs as its own account and must create files here, so the
            # script group gets create access — setgid so new files carry the
            # group, sticky so only an owner may remove or rename anything.
            # Without that the dropped script cannot write a single event file.
            # THE ACCOUNT'"'"'S ACTUAL PRIMARY GROUP, resolved rather than
            # assumed. An account name is not a group name: `useradd` often
            # creates a like-named group, but a valid account can have any
            # primary group, and `chgrp "$TB_WALL_SCRIPT_USER"` then fails and
            # the measured script cannot write one event file. The Go boundary
            # resolves the real GID; this resolves the same thing.
            if [ -n "${TB_WALL_SCRIPT_USER:-}" ]; then
              script_gid="$(id -g "$TB_WALL_SCRIPT_USER")"
              chgrp "$script_gid" "$TB_EVENTS_DIR"
              chmod 3770 "$TB_EVENTS_DIR"
            fi
            echo "=== ${BUCKET_NAME} — estimated ${BUCKET_EST:-?}s ==="
            printf "%s\n" "$BUCKET_SCRIPT" > "$RUNNER_TEMP/testbucket-bucket.sh"
            echo "--- invocations ---"
            cat "$RUNNER_TEMP/testbucket-bucket.sh"
            echo "--- output ---"

            # VB: the complete generated script under its own physical
            # envelope, containment peer and independent trace. The run
            # identity is inherited from the action state `wall begin` wrote,
            # so the script and its invocations bind the same Stage-1 and
            # Stage-2 receipts the action does. The wrapper exits with the
            # script status and `wall run` passes it on, so a red bucket stays
            # red.
            testbucket wall exec --dir "$TB_WALL_DIR" --level script \
              --desc "$BUCKET_NAME" -- bash "$RUNNER_TEMP/testbucket-bucket.sh"
          '
          status=$?
        else
          # Unmeasured: exactly what this step always did.
          mkdir -p "$TB_EVENTS_DIR"
          echo "=== ${BUCKET_NAME} — estimated ${BUCKET_EST:-?}s ==="
          printf '%s\n' "$BUCKET_SCRIPT" > "$RUNNER_TEMP/testbucket-bucket.sh"
          echo "--- invocations ---"
          cat "$RUNNER_TEMP/testbucket-bucket.sh"
          echo "--- output ---"

          # The generated script already tees each stream to the events
          # directory for the record job. The status taken is the SCRIPT's
          # (PIPESTATUS[0]), never the renderer's.
          set +e
          if [ "$TB_RUNNER" = "go" ]; then
            # Go's script emits `go test -json` on stdout; pipe it through
            # `testbucket render` to reproduce the plain test log for humans.
            bash "$RUNNER_TEMP/testbucket-bucket.sh" | testbucket render
            status=${PIPESTATUS[0]}
          else
            # Vitest's script prints a default-reporter log itself (the JSON
            # report goes to a side file), so run it directly.
            bash "$RUNNER_TEMP/testbucket-bucket.sh"
            status=$?
          fi
        fi
        set -e
        exit "$status"

    # AT_end, after verified-empty containment. It runs even when the bucket
    # failed: a failed bucket is still a complete measurement of a failed
    # bucket, and an envelope left open would be a missing row rather than a
    # recorded failure.
    - name: Close the wall-time action envelope
      if: always() && inputs.wall-time-dir != ''
      shell: bash
      env:
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
        # The account the MEASURED WORK runs under. The wrapper stays as this
        # step's user, which may write the delegated subtree; the measured
        # command is executed as this account, which may not. Empty means no
        # boundary was established, and the row is recorded in full and
        # reported INELIGIBLE rather than scored.
        # The run key again, scoped to THIS step. `wall end` seals the exact
        # bytes of every stream and of the key log with it, after the measured
        # script has finished and in a step that script was never in.
        TB_OUTCOME: ${{ steps.run.outcome }}
      run: |
        set -euo pipefail
        terminal=passed
        reason=""
        if [ "$TB_OUTCOME" != "success" ]; then
          terminal=failed
          reason="the bucket step outcome was $TB_OUTCOME"
        fi
        testbucket wall end --dir "$TB_WALL_DIR" --terminal "$terminal" --reason "$reason"

    # THE OBSERVATION, ASSEMBLED WHERE THE EVIDENCE IS.
    #
    # This is the step that was missing: the job uploaded raw record
    # directories and the record job downloaded events and a plan, and nothing
    # turned the two into the document `ingest` reads. `shard-plan` was
    # declared on this action and referenced nowhere, which is why the verbatim
    # profile copy QC13 compares had no producer.
    #
    # It runs AFTER `wall end`, because the closing reading is part of the
    # interval the observation reports and an assembly inside the envelope
    # would measure itself.
    - name: Assemble the wall observation
      if: always() && inputs.wall-time-dir != '' && inputs.shard-plan != ''
      shell: bash
      env:
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
        TB_SHARD_PLAN: ${{ inputs.shard-plan }}
        BUCKET_NAME: ${{ inputs.name }}
        TB_RUNS_ON_LABEL: ${{ inputs.runs-on-label }}
        TB_CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        TB_WORKLOAD_COMMIT: ${{ inputs.workload-commit }}
        TB_CAMPAIGN_ID: ${{ inputs.campaign-id }}
        TB_CACHE_DECLARATION_FILE: ${{ inputs.cache-declaration-file }}
      run: |
        set -euo pipefail
        # NAMED FOR ITS BUCKET. The record job merges every bucket's artifact
        # into one directory, so a fixed name would have each upload overwrite
        # the last and the run would learn from exactly one bucket.
        out="${RUNNER_TEMP}/observation-${BUCKET_NAME}.json"
        args=(
          --dir "$TB_WALL_DIR"
          --shard-plan "$TB_SHARD_PLAN"
          --bucket-name "$BUCKET_NAME"
          --out "$out"
          --runs-on-label "$TB_RUNS_ON_LABEL"
          --actual-runner-name "${RUNNER_NAME:-}"
          --repository "${GITHUB_REPOSITORY:-}"
          --run-id "${GITHUB_RUN_ID:-}"
          --attempt-id "${GITHUB_RUN_ATTEMPT:-}"
          --job "${GITHUB_JOB:-}"
          --head-sha "${GITHUB_SHA:-}"
          --candidate-sha "$TB_CANDIDATE_SHA"
          --workload-commit "$TB_WORKLOAD_COMMIT"
        )
        if [ -n "$TB_CAMPAIGN_ID" ]; then args+=(--campaign-id "$TB_CAMPAIGN_ID"); fi
        if [ -n "$TB_CACHE_DECLARATION_FILE" ]; then
          args+=(--cache-declaration-file "$TB_CACHE_DECLARATION_FILE")
        fi
        if [ -n "${TB_CACHE_STATE_FILE:-}" ]; then
          args+=(--cache-state "$TB_CACHE_STATE_FILE")
        fi
        testbucket wall assemble-observation "${args[@]}"

    # UNIQUELY NAMED PER BUCKET, so the record job can download every bucket's
    # observation into one directory without them overwriting each other.
    - name: Upload the wall observation
      if: always() && inputs.wall-time-dir != '' && inputs.shard-plan != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: testbucket-wall-obs-${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/observation-${{ inputs.name }}.json
        if-no-files-found: warn
        retention-days: 14
