name: testbucket verify-wall
description: >-
  Verify a bucket's wall-time records. It is a SEPARATE action from run-bucket
  on purpose: the contract puts AT_end after the final action epilogue, so
  verification cannot be a later step of the action whose envelope it is
  checking — that would put action-owned work after the interval that claims to
  contain it.

  What it checks is the records plus the plan they were rendered from: schema,
  terminal state, positive monotonic duration, plan/bucket identity, exact
  invocation membership, and event coverage. The authority, replay, registry,
  Pcheck, training and signer inputs are gone with the machinery behind them —
  an input whose evidence no longer exists is an input that can only be
  ignored.

inputs:
  wall-time-dir:
    description: 'Records directory the run-bucket action wrote (required).'
    required: true
  version:
    description: >-
      testbucket binary to install: a moving `vX`/`vX.Y` alias, an exact
      `vX.Y.Z`, or "local" to build from the checked-out source. The default is
      the moving `v0` alias, which resolves to the highest published 0.x
      release — this project is deliberately pre-1.0.
    default: v0
  shard-plan-file:
    description: >-
      The authorised plan artifact. ONE document answers three of the six
      checks: it names the bucket this measurement claims, it carries the
      invocation identities the measured argv, selector, unit membership and
      atom closure are compared against, and with `events-dir` it is what
      proves this bucket ran the targets, count-shards and name slices the plan
      gave it.

      A wall-time envelope records how long something took; it can never record
      what was skipped. Without this a row can be complete having measured a
      script that did half its work.
    default: ""
  events-dir:
    description: >-
      This bucket's runner events directory, for the coverage audit above.
    default: ""
  runner:
    description: >-
      Which adapter's event parser reads `events-dir`: go or vitest.
    default: go

runs:
  using: composite
  steps:
    - name: Install testbucket
      shell: bash
      env:
        TB_VERSION: ${{ inputs.version }}
        TB_REPO: invakid404/testbucket
        TB_BINDIR: ${{ runner.temp }}/testbucket-bin
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/../install-testbucket.sh"

    - name: Verify the wall-time records
      shell: bash
      env:
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
        TB_SHARD_PLAN_FILE: ${{ inputs.shard-plan-file }}
        TB_EVENTS_DIR: ${{ inputs.events-dir }}
        TB_RUNNER: ${{ inputs.runner }}
      run: |
        set -euo pipefail
        # `if` blocks rather than `[ -n x ] && args+=(...)`: under `set -e` a
        # trailing test that is false makes the whole step fail, which would
        # turn "this consumer passed no plan artifact" into a red bucket.
        args=(--dir "$TB_WALL_DIR")
        if [ -n "$TB_SHARD_PLAN_FILE" ]; then args+=(--shard-plan "$TB_SHARD_PLAN_FILE"); fi
        if [ -n "$TB_EVENTS_DIR" ]; then args+=(--events "$TB_EVENTS_DIR" --runner "$TB_RUNNER"); fi
        testbucket wall verify "${args[@]}"
