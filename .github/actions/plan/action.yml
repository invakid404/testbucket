name: testbucket plan
description: >-
  Install testbucket and compute a K-way, time-balanced bucket matrix from a
  rolling timing store. Emits the fromJSON matrix for a fan-out plus the path of
  the full shard-plan. The never-drop-a-test coverage gate runs inside the plan:
  if any live target would go unscheduled it fails closed and emits no matrix.

inputs:
  runner:
    description: 'Test-runner adapter: go or vitest.'
    default: go
  k:
    description: 'Number of buckets — the single knob (adding a lane = bumping k).'
    default: "6"
  count:
    description: 'Flake-sweep -count for the Go runner; the Vitest runner requires 1.'
    default: "1"
  file-parallelism:
    description: >-
      Intra-bucket file/package concurrency baked into each bucket's script (#22).
      1 (the default) keeps a bucket serial — `-p=1` (Go) / `--no-file-parallelism`
      (Vitest) — which is the sum-of-weights cost model the balancer packs to. A
      value >1 renders `-p=N` / `--maxWorkers=N` so a bucket uses more cores, at
      the cost of that model: a bucket then finishes nearer its heaviest unit than
      its sum (its estimate over-reads), and timings recorded under it contend and
      so are less comparable. Prefer raising `k` before raising this.
    default: "1"
  store-path:
    description: 'Timing-store JSON path; a missing store is a cold start, not an error.'
    default: test-timings.json
  events-dir:
    description: >-
      Absolute directory the emitted invocations tee their events into for a
      later ingest. Must be a literal path (it is baked into the plan script and
      executed on a different runner), so do not use a per-job variable.
    default: /tmp/testbucket-events
  shard-plan:
    description: 'Path to write the full shard-plan JSON (upload it for the record job to audit).'
    default: /tmp/testbucket-shard-plan.json
  version:
    description: 'testbucket binary to install: the moving v1 alias, an exact vX.Y.Z, or "local" to build from the checked-out source.'
    default: v1
  working-directory:
    description: 'Directory to plan in (where the tests live).'
    default: "."
  vitest-command:
    description: 'How to invoke vitest (--runner vitest); empty means "npx vitest". Ignored for the Go runner.'
    default: ""
  node-prefixes:
    description: >-
      Comma-separated package-dir prefixes whose buckets need Node set up; sets
      the matrix `needs_node` flag so the consumer job can gate its Node/tooling
      setup on it. Empty = no bucket needs Node.
    default: ""
  exclude-module:
    description: >-
      Module dirs (globs) to leave out of the discovered module set, one per
      line; repeatable, replaces the tool's empty default. Scopes BOTH the split
      and the never-drop coverage gate (a consumer opts cgo/vendored/pinned
      modules out of the pure lane here). Empty = every module under the working
      directory is in scope.
    default: ""
  setup-command:
    description: >-
      Optional shell command run once, in the working-directory, BEFORE the plan
      command — the same per-runner provisioning seam as run-bucket, for discovery
      that needs a toolchain (codegen, generated sources) before the module set is
      resolved. Runs as a bash block; a failure fails the plan. Empty = no setup
      step ⇒ unchanged behavior.
    default: ""
  wall-time-dir:
    description: >-
      Optional records directory for complete-action wall-time measurement
      (runner: vitest). When set, every rendered invocation in the generated
      script runs under `testbucket wall exec`, so it gets a physical envelope,
      a containment peer and an independent trace. It MUST match the
      wall-time-dir the run-bucket action is given: the script names the
      directory, and a mismatch would write records nobody verifies. Empty = no
      measurement ⇒ byte-identical script to before.
    default: ""

outputs:
  matrix:
    description: 'The fromJSON matrix to feed the test job''s strategy.'
    value: ${{ steps.plan.outputs.matrix }}
  shard-plan:
    description: 'Path of the written shard-plan JSON.'
    value: ${{ inputs.shard-plan }}

runs:
  using: composite
  steps:
    - name: Install testbucket
      shell: bash
      env:
        TB_VERSION: ${{ inputs.version }}
        TB_REPO: invakid404/testbucket
        TB_BINDIR: ${{ runner.temp }}/testbucket-bin
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/../install-testbucket.sh"

    # A consumer's own provisioning, run before discovery — for a toolchain the
    # module walk needs (codegen, generated sources). Passed through the
    # environment and executed as a bash block (never spliced into the command
    # line) so consumer-supplied data cannot grow an injection; `-e` so a failed
    # provisioning step fails the plan rather than yielding a wrong module set.
    - name: Set up the plan
      if: inputs.setup-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TB_SETUP_COMMAND: ${{ inputs.setup-command }}
      run: bash -eo pipefail -c "$TB_SETUP_COMMAND"

    - name: Compute the bucket matrix
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TB_RUNNER: ${{ inputs.runner }}
        TB_K: ${{ inputs.k }}
        TB_COUNT: ${{ inputs.count }}
        TB_FILE_PARALLELISM: ${{ inputs.file-parallelism }}
        TB_STORE: ${{ inputs.store-path }}
        TB_EVENTS_DIR: ${{ inputs.events-dir }}
        TB_SHARD_PLAN: ${{ inputs.shard-plan }}
        TB_VITEST_COMMAND: ${{ inputs.vitest-command }}
        TB_NODE_PREFIXES: ${{ inputs.node-prefixes }}
        TB_EXCLUDE_MODULE: ${{ inputs.exclude-module }}
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
      run: |
        set -euo pipefail
        if [ -f "$TB_STORE" ]; then
          echo "planning from the restored store at $TB_STORE"
        else
          echo "no store at $TB_STORE — planning from the cold-start mean weight"
        fi

        # A vitest command override is passed as one properly-quoted argument
        # (an array element), never spliced into the command line, so a
        # multi-word command survives with its grouping intact.
        extra=()
        if [ -n "$TB_VITEST_COMMAND" ]; then
          extra+=(--vitest-command "$TB_VITEST_COMMAND")
        fi

        # A comma-separated node-prefixes string opts specific buckets into Node
        # setup (needs_node=true); empty leaves every bucket needs_node=false.
        if [ -n "$TB_NODE_PREFIXES" ]; then
          extra+=(--node-prefixes "$TB_NODE_PREFIXES")
        fi

        # exclude-module is one glob per line, each passed as its own repeatable
        # flag so a consumer can scope cgo/vendored/pinned modules out of the
        # pure lane (and out of the coverage gate). Blank lines are skipped.
        while IFS= read -r mod; do
          [ -n "$mod" ] && extra+=(--exclude-module "$mod")
        done <<< "$TB_EXCLUDE_MODULE"

        # Wall-time measurement is opt-in and Vitest-only. Passing the flag only
        # when it is set keeps the generated script byte-identical for everyone
        # who has not asked for it.
        if [ -n "$TB_WALL_DIR" ]; then
          extra+=(--wall-dir "$TB_WALL_DIR")
        fi

        # --json puts the fromJSON matrix on stdout and the loaded-vs-missing
        # summary on stderr, so the summary lands in this log while the matrix
        # stays machine-clean. The coverage gate runs inside this command: a
        # live target left unscheduled exits non-zero and emits no matrix,
        # failing the fan-out closed rather than open.
        matrix=$(testbucket plan \
          --runner "$TB_RUNNER" \
          --k "$TB_K" \
          --count "$TB_COUNT" \
          --file-parallelism "$TB_FILE_PARALLELISM" \
          --store "$TB_STORE" \
          --events-dir "$TB_EVENTS_DIR" \
          --shard-plan "$TB_SHARD_PLAN" \
          "${extra[@]}" \
          --json)

        # printf, not echo: the matrix carries \n escapes inside its script
        # fields, and some shells' echo would expand them into real newlines,
        # corrupting the JSON and the single-line key=value $GITHUB_OUTPUT form.
        printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
