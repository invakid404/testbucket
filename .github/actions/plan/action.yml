name: testbucket plan
description: >-
  Install testbucket and compute a K-way, time-balanced bucket matrix from a
  rolling timing store. Emits the fromJSON matrix for a fan-out plus the path of
  the full shard-plan. The never-drop-a-test coverage gate runs inside the plan:
  if any live target would go unscheduled it fails closed and emits no matrix.

inputs:
  runner:
    description: 'Test-runner adapter: go or vitest.'
    default: go
  k:
    description: 'Number of buckets — the single knob (adding a lane = bumping k).'
    default: "6"
  count:
    description: 'Flake-sweep -count for the Go runner; the Vitest runner requires 1.'
    default: "1"
  file-parallelism:
    description: >-
      Intra-bucket file/package concurrency baked into each bucket's script (#22).
      1 (the default) keeps a bucket serial — `-p=1` (Go) / `--no-file-parallelism`
      (Vitest) — which is the sum-of-weights cost model the balancer packs to. A
      value >1 renders `-p=N` / `--maxWorkers=N` so a bucket uses more cores, at
      the cost of that model: a bucket then finishes nearer its heaviest unit than
      its sum (its estimate over-reads), and timings recorded under it contend and
      so are less comparable. Prefer raising `k` before raising this.
    default: "1"
  store-path:
    description: 'Timing-store JSON path; a missing store is a cold start, not an error.'
    default: test-timings.json
  events-dir:
    description: >-
      Absolute directory the emitted invocations tee their events into for a
      later ingest. Must be a literal path (it is baked into the plan script and
      executed on a different runner), so do not use a per-job variable.
    default: /tmp/testbucket-events
  shard-plan:
    description: 'Path to write the full shard-plan JSON (upload it for the record job to audit).'
    default: /tmp/testbucket-shard-plan.json
  version:
    description: >-
      testbucket binary to install: a moving `vX`/`vX.Y` alias, an exact
      `vX.Y.Z`, or "local" to build from the checked-out source. The default is
      the moving `v0` alias, which resolves to the highest published 0.x
      release — this project is deliberately pre-1.0. A scored arm must pin an
      exact `vX.Y.Z` instead: an alias is descriptive metadata, not a delivery
      identity.
    default: v0
  working-directory:
    description: 'Directory to plan in (where the tests live).'
    default: "."
  vitest-command:
    description: 'How to invoke vitest (--runner vitest); empty means "npx vitest". Ignored for the Go runner.'
    default: ""
  node-prefixes:
    description: >-
      Comma-separated package-dir prefixes whose buckets need Node set up; sets
      the matrix `needs_node` flag so the consumer job can gate its Node/tooling
      setup on it. Empty = no bucket needs Node.
    default: ""
  exclude-module:
    description: >-
      Module dirs (globs) to leave out of the discovered module set, one per
      line; repeatable, replaces the tool's empty default. Scopes BOTH the split
      and the never-drop coverage gate (a consumer opts cgo/vendored/pinned
      modules out of the pure lane here). Empty = every module under the working
      directory is in scope.
    default: ""
  setup-command:
    description: >-
      Optional shell command run once, in the working-directory, BEFORE the plan
      command — the same per-runner provisioning seam as run-bucket, for discovery
      that needs a toolchain (codegen, generated sources) before the module set is
      resolved. Runs as a bash block; a failure fails the plan. Empty = no setup
      step ⇒ unchanged behavior.
    default: ""
  wall-time-dir:
    description: >-
      Optional records directory for complete-action wall-time measurement
      (runner: vitest). When set, every rendered invocation in the generated
      script runs under `testbucket wall exec`, so it gets a physical envelope,
      a containment peer and an independent trace. It MUST match the
      wall-time-dir the run-bucket action is given: the script names the
      directory, and a mismatch would write records nobody verifies. Empty = no
      measurement ⇒ byte-identical script to before.
    default: ""

  # --- contract §21 added inputs -------------------------------------------
  est-basis:
    description: >-
      Which weight the partition is built from: `reporter` (default) or `wall`.
      Mode selection is contract §16.1; §0.8's phase 1 decides what plan would
      be produced and phase 2 vetoes a cold plan for a scored run.
    default: reporter
  scored:
    description: >-
      Whether this plan belongs to a scored campaign run. Nothing else can
      derive it — basis does not imply it, since a scored B arm runs `reporter`
      and an unscored warm-up may too — so it is an explicit boolean and it
      gates PD-2's phase-2 veto plus AD-8…AD-10.
    default: "false"
  runner-class:
    description: >-
      The stable execution-class string of comparability-key leaf 1 (§15.3). It
      replaces the former runner_name leaf, whose per-instance value had no
      cross-run stability contract and made MIN_RUNS = 3 under one key
      unreachable. Required non-empty for a scored plan (AD-8).
    default: ""
  runs-on-label:
    description: >-
      The caller's resolved `runs-on` label, the producer for key leaf 2. No
      GitHub context yields it inside a composite action, so the caller passes
      it explicitly; the same value goes to run-bucket, which echoes it as
      observed_runs_on_label for QC12. Required non-empty for a scored plan
      (AD-8).
    default: ""
  cache-declaration-file:
    description: >-
      Job-local file holding the canonical cache declaration of §10.5.0, which
      the plan job materialized from `cache-declaration-json` and verified
      against `cache-declaration-digest-expected` (§10.5.2 steps 0b–0c). plan
      validates only the declaration leaves and refuses before emitting a
      matrix; it never sees a matched key, a disposition or an executed digest,
      because those do not exist yet. Required for a scored plan (AD-9).
    default: ""
  candidate-sha:
    description: >-
      The testbucket commit the executing binary was built from. Neither the
      runner context nor the binary carries it, so the caller that built it
      passes it. Required for a scored plan (AD-10).
    default: ""
  workload-commit:
    description: >-
      The consumer checkout this run executes against. The orchestrator checked
      it out at a full SHA, so it is the only party that knows it. Required for
      a scored plan (AD-10).
    default: ""
outputs:
  matrix:
    description: 'The fromJSON matrix to feed the test job''s strategy.'
    value: ${{ steps.plan.outputs.matrix }}
  shard-plan:
    description: 'Path of the written shard-plan JSON.'
    value: ${{ inputs.shard-plan }}

  cache-declaration-json:
    description: >-
      The canonical cache-declaration bytes the plan job verified, as a
      single-line string. Job outputs are the transport because they cross the
      job boundary with no extra permission and no artifact hop; a pathname
      would transport nothing, since separate jobs share no filesystem
      (§10.5.2 step 2).
    value: ${{ steps.plan.outputs.cache-declaration-json }}
  cache-declaration-digest:
    description: >-
      SHA-256 over those same bytes. Every matrix job materializes the JSON to
      a job-local file and run-bucket re-verifies this digest before use, which
      is what makes cross-job byte identity a checked property.
    value: ${{ steps.plan.outputs.cache-declaration-digest }}
runs:
  using: composite
  steps:
    - name: Install testbucket
      shell: bash
      env:
        TB_VERSION: ${{ inputs.version }}
        TB_REPO: invakid404/testbucket
        TB_BINDIR: ${{ runner.temp }}/testbucket-bin
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/../install-testbucket.sh"

    # A consumer's own provisioning, run before discovery — for a toolchain the
    # module walk needs (codegen, generated sources). Passed through the
    # environment and executed as a bash block (never spliced into the command
    # line) so consumer-supplied data cannot grow an injection; `-e` so a failed
    # provisioning step fails the plan rather than yielding a wrong module set.
    - name: Set up the plan
      if: inputs.setup-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TB_SETUP_COMMAND: ${{ inputs.setup-command }}
      run: bash -eo pipefail -c "$TB_SETUP_COMMAND"

    - name: Compute the bucket matrix
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TB_RUNNER: ${{ inputs.runner }}
        TB_K: ${{ inputs.k }}
        TB_COUNT: ${{ inputs.count }}
        TB_FILE_PARALLELISM: ${{ inputs.file-parallelism }}
        TB_STORE: ${{ inputs.store-path }}
        TB_EVENTS_DIR: ${{ inputs.events-dir }}
        TB_SHARD_PLAN: ${{ inputs.shard-plan }}
        TB_VITEST_COMMAND: ${{ inputs.vitest-command }}
        TB_NODE_PREFIXES: ${{ inputs.node-prefixes }}
        TB_EXCLUDE_MODULE: ${{ inputs.exclude-module }}
        TB_WALL_DIR: ${{ inputs.wall-time-dir }}
        TB_EST_BASIS: ${{ inputs.est-basis }}
        TB_SCORED: ${{ inputs.scored }}
        TB_RUNNER_CLASS: ${{ inputs.runner-class }}
        TB_RUNS_ON_LABEL: ${{ inputs.runs-on-label }}
        # THE SAME COMMAND THE STEP ABOVE EXECUTED. §15.3 makes setup_command a
        # key leaf: this action runs arbitrary consumer provisioning before
        # discovery, and an environment built by a different command is a
        # different population. The key hard-coded it empty, so it could not.
        TB_SETUP_COMMAND: ${{ inputs.setup-command }}
        TB_CACHE_DECLARATION_FILE: ${{ inputs.cache-declaration-file }}
        TB_CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        TB_WORKLOAD_COMMIT: ${{ inputs.workload-commit }}
      run: |
        set -euo pipefail

        # THE FROZEN PLANNING PATH IS REMOVED.
        #
        # It planned from a signed Stage-1 manifest over a frozen input bundle,
        # and it invoked nine CLI flags — --wall-bundle, --wall-stage1,
        # --wall-authority-key, --wall-authority, --wall-stage2,
        # --palloc-scorer, --wall-registry, --wall-out-dir and
        # --wall-claim-store — every one of which went with the
        # protected-authority model. The block was therefore not merely
        # research-era surface: it would have failed at runtime on the first
        # unrecognised flag. What remains is the ordinary path, which reads the
        # live tree and the restored store.

        if [ -f "$TB_STORE" ]; then
          echo "planning from the restored store at $TB_STORE"
        else
          echo "no store at $TB_STORE — planning from the cold-start mean weight"
        fi

        # A vitest command override is passed as one properly-quoted argument
        # (an array element), never spliced into the command line, so a
        # multi-word command survives with its grouping intact.
        extra=()
        if [ -n "$TB_VITEST_COMMAND" ]; then
          extra+=(--vitest-command "$TB_VITEST_COMMAND")
        fi

        # A comma-separated node-prefixes string opts specific buckets into Node
        # setup (needs_node=true); empty leaves every bucket needs_node=false.
        if [ -n "$TB_NODE_PREFIXES" ]; then
          extra+=(--node-prefixes "$TB_NODE_PREFIXES")
        fi

        # exclude-module is one glob per line, each passed as its own repeatable
        # flag so a consumer can scope cgo/vendored/pinned modules out of the
        # pure lane (and out of the coverage gate). Blank lines are skipped.
        while IFS= read -r mod; do
          [ -n "$mod" ] && extra+=(--exclude-module "$mod")
        done <<< "$TB_EXCLUDE_MODULE"

        # Wall-time measurement is opt-in and Vitest-only. Passing the flag only
        # when it is set keeps the generated script byte-identical for everyone
        # who has not asked for it.
        if [ -n "$TB_WALL_DIR" ]; then
          extra+=(--wall-dir "$TB_WALL_DIR")
        fi

        # --- contract §19.3a scored admission, before any matrix exists -------
        #
        # AD-8, AD-9 and AD-10 are enforced HERE because §7 rule 17 names plan
        # as the component that must refuse before emitting a matrix. An
        # unscored run may omit every one of these and keeps its current
        # defaults.
        if [ "$TB_SCORED" = "true" ]; then
          for pair in \
            "runner-class:$TB_RUNNER_CLASS" \
            "runs-on-label:$TB_RUNS_ON_LABEL" \
            "cache-declaration-file:$TB_CACHE_DECLARATION_FILE" \
            "candidate-sha:$TB_CANDIDATE_SHA" \
            "workload-commit:$TB_WORKLOAD_COMMIT"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ -z "$value" ]; then
              echo "scored plan refused: $name is empty (contract §19.3a)" >&2
              exit 1
            fi
          done
          if [ ! -f "$TB_CACHE_DECLARATION_FILE" ]; then
            echo "scored plan refused: cache-declaration-file $TB_CACHE_DECLARATION_FILE does not exist" >&2
            exit 1
          fi
        fi

        # --- §10.5.2 step 2: publish the declaration as JOB OUTPUTS ----------
        #
        # Job outputs are the transport because they cross the job boundary
        # with no extra permission and no artifact hop. A pathname would carry
        # nothing: separate jobs share no filesystem, so only content plus a
        # verified digest establishes byte identity.
        if [ -n "$TB_CACHE_DECLARATION_FILE" ] && [ -f "$TB_CACHE_DECLARATION_FILE" ]; then
          # tr -d '\n' keeps the canonical single-line form the digest is taken
          # over; a trailing newline would change the bytes run-bucket verifies.
          decl=$(tr -d '\n' < "$TB_CACHE_DECLARATION_FILE")
          printf 'cache-declaration-json=%s\n' "$decl" >> "$GITHUB_OUTPUT"
          printf 'cache-declaration-digest=%s\n' \
            "$(printf '%s' "$decl" | sha256sum | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
          extra+=(--cache-declaration-file "$TB_CACHE_DECLARATION_FILE")
        fi

        # est-basis selects the partition WEIGHT only; unit topology is
        # store-derived in both bases (§16.1).
        if [ -n "$TB_EST_BASIS" ]; then
          extra+=(--est-basis "$TB_EST_BASIS")
        fi
        if [ "$TB_SCORED" = "true" ]; then
          extra+=(--scored)
        fi
        for flag_pair in \
          "--runner-class:$TB_RUNNER_CLASS" \
          "--runs-on-label:$TB_RUNS_ON_LABEL" \
          "--candidate-sha:$TB_CANDIDATE_SHA" \
          "--workload-commit:$TB_WORKLOAD_COMMIT"; do
          flag=${flag_pair%%:*}
          value=${flag_pair#*:}
          if [ -n "$value" ]; then
            extra+=("$flag" "$value")
          fi
        done

        # --json puts the fromJSON matrix on stdout and the loaded-vs-missing
        # summary on stderr, so the summary lands in this log while the matrix
        # stays machine-clean. The coverage gate runs inside this command: a
        # live target left unscheduled exits non-zero and emits no matrix,
        # failing the fan-out closed rather than open.
        matrix=$(testbucket plan \
          --runner "$TB_RUNNER" \
          --k "$TB_K" \
          --count "$TB_COUNT" \
          --file-parallelism "$TB_FILE_PARALLELISM" \
          --store "$TB_STORE" \
          --events-dir "$TB_EVENTS_DIR" \
          --shard-plan "$TB_SHARD_PLAN" \
          --setup-command "$TB_SETUP_COMMAND" \
          "${extra[@]}" \
          --json)

        # printf, not echo: the matrix carries \n escapes inside its script
        # fields, and some shells' echo would expand them into real newlines,
        # corrupting the JSON and the single-line key=value $GITHUB_OUTPUT form.
        printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
