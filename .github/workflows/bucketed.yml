name: Bucketed (dogfood)

# testbucket bucketing its OWN test suite — the tool run through itself, now via
# the SAME reusable workflow and composite actions it ships for consumers
# (.github/workflows/bucketed-reusable.yml + .github/actions/{plan,run-bucket,
# record}). If the dogfood is green, the product a consumer adopts is green.
#
# The reusable workflow does the work: a cheap `plan` job partitions the live
# package set K ways from a rolling timing store and emits a fromJSON matrix; a
# `test` job fans out over it; a master-only `record` job folds the measured
# timings back in so the next split is better. The never-drop-a-test coverage
# gate inside `plan` makes the fan-out safe.
#
# This lane pins `testbucket-version: local`, so the actions BUILD testbucket
# from this very commit's source rather than downloading a release — the dogfood
# always exercises the code under review, and it stays green before any release
# exists. External consumers instead pin `@v0` and get the released binary.
#
# The `baseline` job runs the same tests unbucketed, so the two makespans are
# directly comparable on the same commit. This suite is small (the tool has few
# packages), so this lane's value is proof the loop closes end to end, not a
# wall-time win — the design transfers to a large suite, which is where the
# K-way split pays off.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: bucketed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Baseline: the same tests, unbucketed. The number the fan-out is measured
  # against.
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: go test ./... (unbucketed)
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------------------
  # Bucketed: the plan -> matrix -> test -> record loop, consumed exactly the way
  # a downstream repo consumes it — through the reusable workflow, whose composite
  # actions resolve to this repo at this commit (the `$/` self-reference). The
  # single K knob is `k`; a real consumer suite runs it at 6+.
  bucketed:
    uses: ./.github/workflows/bucketed-reusable.yml
    # THE CALLER GRANTS WHAT THE CALLED JOBS DECLARE, and no more.
    #
    # A called workflow may only retain or reduce what its caller granted, so a
    # caller granting less than a job declares fails at startup. The
    # `actions: read` this used to add was the A_GH collector's; the collector
    # is gone, so the grant is gone with it. A test refuses the pair if the
    # declarations and the grants drift apart again.
    permissions:
      contents: read
    with:
      runner: go
      k: "2"
      count: "1"
      cache-scope: dogfood
      testbucket-version: local
      go-version: "1.27"
      # SUPPLIED, NOT DEFAULTED. One input schedules the jobs and identifies
      # the runner in the comparability key; QC12 rejects an empty observed
      # label unconditionally, so the value the dogfood lane runs under is
      # stated here rather than left to a default nobody reads.
      runs-on-label: ubuntu-latest

  # ---------------------------------------------------------------------------
  # Bucketed (Vitest): the SAME reusable workflow driving the Vitest adapter over
  # the repo's Vitest fixture, with testbucket-version: local. This is the
  # realistic nested shape — runner: vitest, working-directory: a subdir, local
  # install — so it proves the local build resolves testbucket's source from the
  # action checkout (NOT the suite working-directory) and that Go is provisioned
  # for a local build even on a Vitest runner. The count stays 1 (Vitest's only
  # valid sweep).
  bucketed-vitest:
    uses: ./.github/workflows/bucketed-reusable.yml
    # Same grant, same reason: see the `bucketed` job above.
    permissions:
      contents: read
    with:
      runner: vitest
      k: "2"
      count: "1"
      cache-scope: dogfood-vitest
      testbucket-version: local
      working-directory: testdata/vitest-sample
      node-version: "24.19.0"
      # Same input, same reason: see the `bucketed` job above. The Vitest lane
      # is the one that MEASURES, so an empty label here would mean the dogfood
      # observation could never qualify.
      runs-on-label: ubuntu-latest
      # THE DOGFOOD LANE MEASURES.
      #
      # Without this the Vitest lane exercises planning and running but never
      # the wall-time path, so nothing in CI would notice a measured run that
      # crashes, records no process identity, or produces an observation the
      # record job cannot ingest. Those are exactly the failures that reached a
      # published candidate while every green test asserted helpers.
      #
      # The Go lane above stays unwrapped deliberately: wall-time is
      # Vitest-only, and `--wall-dir` with `--runner go` is refused.
      wall-time-dir: /tmp/testbucket-wall
