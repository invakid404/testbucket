name: testbucket bucketed (reusable)

# A drop-in bucketed unit-test lane a consumer adopts in ~10 lines:
#
#   jobs:
#     tests:
#       uses: invakid404/testbucket/.github/workflows/bucketed-reusable.yml@<full-40-hex-sha>
#       with:
#         runner: go       # or vitest
#         k: "6"
#
# It wires plan -> matrix -> test -> record: a cheap `plan` job partitions the
# live target set K ways from a rolling timing store and emits a fromJSON matrix;
# the `test` job fans out over it, each bucket running only its own slice; a
# default-branch-only `record` job audits the run and folds the measured timings
# back into the store, so the next split is better than this one. The coverage
# gate inside `plan` is what makes the fan-out safe: it refuses to emit a matrix
# unless every live target lands in exactly one bucket.
#
# The composite actions are referenced with the `$/` SELF-REPOSITORY syntax, so
# they resolve to THIS repo at the SAME ref the reusable workflow was called
# with — the pinned actions for an external `@v0` consumer, and the local
# checkout for testbucket's own pre-release dogfood.
#
# Plain `./` would resolve against the WORKSPACE, which for a called reusable
# workflow is the CALLER's checkout: an external consumer would look for
# `.github/actions/plan` in its own repository and not find it. The internal
# dogfood would still pass, which is exactly what makes that mistake expensive.
#
# `$/` requires a GitHub-hosted runner or a self-hosted runner >= 2.336.0 (see
# the 2026-07-30 self-repository-syntax changelog). actionlint does not yet know
# the spelling and reports "ref is missing"; that diagnostic is suppressed for
# this file in .github/actionlint.yaml, with the same reasoning written there.

on:
  # CALLER PERMISSIONS — REQUIRED, not advisory.
  #
  # Each job below declares its own least-privilege token, and a called
  # workflow may only retain or reduce what its caller granted. So a caller
  # grants exactly:
  #
  #     permissions:
  #       contents: read
  #
  # `contents: read` is what checkout and the same-run artifact steps need, and
  # it is all three jobs need. The `actions: read` this used to ask for was the
  # A_GH collector's, which read the test job's own step timestamps back
  # through the Actions API; A_GH was a diagnostic that never entered a gate,
  # and it left with the collector.
  #
  # A caller that grants less no longer merely loses A_GH: the `test` job
  # declares the permission, so the run fails at startup instead of proceeding
  # with a token nobody bounded. That is a deliberate, versioned break — see
  # EXPLICIT, EXECUTABLE JOB PERMISSIONS below, which says who it reaches and
  # when.
  workflow_call:
    # NO `secrets:` KEY. §21 exposes "no other input and no secret at all", and
    # absence is how that is spelled. An empty `secrets:` mapping is not the
    # declaration of an empty secret set — Actions rejects it at parse time
    # ("Unexpected value ''"), which takes the whole reusable workflow down
    # before any job starts, and actionlint does not model the rule.
    inputs:
      runner:
        description: 'Test-runner adapter: go or vitest.'
        type: string
        default: go
      k:
        description: 'Number of buckets — the single knob.'
        type: string
        default: "6"
      count:
        description: 'Flake-sweep -count for the Go runner; the Vitest runner requires 1.'
        type: string
        default: "1"
      file-parallelism:
        description: >-
          Intra-bucket file/package concurrency (#22). 1 (default) keeps each
          bucket serial — the sum-of-weights model the balancer packs to. A value
          >1 lets a bucket use more cores (`-p=N` / `--maxWorkers=N`), trading that
          model (a bucket's estimate over-reads and its recorded timings contend).
          Prefer raising `k`.
        type: string
        default: "1"
      test-command:
        description: 'Vitest invocation override (e.g. "npx vitest"); ignored for the Go runner.'
        type: string
        default: ""
      cache-scope:
        description: 'Namespace for the timing-store cache key and artifact names, so multiple suites in one repo do not collide.'
        type: string
        default: default
      testbucket-version:
        description: >-
          Which testbucket binary the actions install: the moving `v0` alias
          (the default — this project is deliberately pre-1.0), an exact
          `vX.Y.Z`, or "local" to build from the checked-out source. A scored
          arm must pin an exact `vX.Y.Z`.
        type: string
        default: v0
      go-version:
        description: 'Go toolchain version (runner: go).'
        type: string
        default: "1.27"
      node-version:
        description: 'Node version (runner: vitest, or any node-needing Go bucket).'
        type: string
        default: "24.19.0"
      working-directory:
        description: 'Directory the tests live in.'
        type: string
        default: "."
      node-prefixes:
        description: 'Forwarded to the plan action (Go runner): comma-separated package-dir prefixes whose buckets need Node set up (sets the matrix needs_node flag). Empty = none.'
        type: string
        default: ""
      exclude-module:
        description: 'Forwarded to plan + record (Go runner): module dirs (globs) to leave out of the discovered module set, one per line. Empty = every module under working-directory is in scope.'
        type: string
        default: ""
      setup-command:
        description: 'Forwarded to plan + test: a shell command run once per job, in the working-directory, before the plan/test command — a per-runner provisioning seam (DB binaries, codegen, toolchains). Empty = no setup step.'
        type: string
        default: ""
      wall-time-dir:
        description: >-
          Forwarded to plan + test (runner: vitest): records directory for
          run-bucket wall-time measurement. When set, the whole Run-bucket
          action runs inside a measured envelope, and each invocation gets one
          of its own. Empty = no measurement ⇒ unchanged behavior.
        type: string
        default: ""
      campaign-id:
        description: 'Campaign identity stamped on every wall-time record.'
        type: string
        default: ""

# EXPLICIT, EXECUTABLE JOB PERMISSIONS — and a versioned boundary.
#
# There is no workflow-level block, because the three jobs do not need the same
# token and a single block would give the widest of them to all three:
#
#   plan     contents: read
#   test     contents: read
#   record   contents: read
#
# All three check out and move same-run artifacts, which the artifact service
# scopes for itself, and none reads the Actions API.
#
# THIS IS A BREAKING CHANGE FOR CALLERS, ON PURPOSE.
#
# A called workflow may only retain or reduce what its caller granted, so a job
# declaring a permission fails at startup for a caller that grants less. That regression shipped once, at a127cb5e, and CI caught it —
# and the answer then was to declare nothing at all and write the requirement
# in a comment. That answer does not bound anything: with no declaration these
# jobs inherit whatever the caller's repository default is, which on many
# repositories is a write-scoped token. A comment asking for two read scopes is
# not a permissions boundary, and "the consumer might grant too much" is the
# case the declaration exists to prevent.
#
# So the boundary is VERSIONED rather than left unenforced. The moving `v0`
# alias does not move — it stays pinned at v0.2.2 — so no consumer resolving
# `@v0`, `@v0.2.2` or any full SHA sees this change; it reaches a consumer only
# when that consumer deliberately re-pins to a release carrying it, and that
# release's notes state the new caller requirement. Every caller inside THIS
# repository is migrated in the same commit, and a test refuses a caller that
# grants less than a called job declares, so the two halves cannot drift apart
# again.

      # --- contract §21 scored caller union ---------------------------------
      #
      # The reusable workflow exposes EVERY scored input (R8-D6). An earlier
      # revision gave the plan action six scored inputs while the workflow
      # exposed only three, so a caller could set `scored: true` through the
      # workflow and then fail AD-9/AD-10 with no way to supply what they need.
      est-basis:
        description: >-
          Which weight the partition is built from: `reporter` (default) or
          `wall` (§16.1).
        type: string
        default: reporter
      scored:
        description: >-
          Whether this run belongs to a scored campaign. Explicit because
          nothing else derives it — a scored B arm runs `reporter` too.
        type: string
        default: "false"
      same-repository-workload:
        description: >-
          Whether the workload this run measures IS the orchestration checkout —
          a project running its own test suite against its own source.

          §7.1's QC15 rejects a row carrying one value in all three provenance
          identities, which is right for every other shape: one `head_sha`
          overloaded into three fields is the defect S-6 removed. For this one
          they genuinely ARE one commit, and there is no truthful distinct value
          for the other two. Declaring it admits that equality and nothing else;
          a scored run may not declare it.
        type: string
        default: "false"
      runner-class:
        description: 'Stable execution-class leaf of the comparability key (§15.3, AD-8).'
        type: string
        default: ""
      runs-on-label:
        description: >-
          The runner label. ONE INPUT SCHEDULES AND IDENTIFIES: every job's
          `runs-on` is this value, and it is also what `plan`, `run-bucket` and
          `record` record as the comparability key's `runner_image_label` and
          the observation's `observed_runs_on_label` (AD-8).

          They used to be two inputs. Jobs ran on a `runs-on` that defaulted to
          `ubuntu-latest` while identity came from a `runs-on-label` that
          defaulted to EMPTY, and QC12 rejects an empty observed label
          unconditionally — so this repository's own default measured run could
          never qualify or train, whatever it measured. No context inside a
          composite action yields the resolved label, which is why it has to be
          passed at all; passing a second, separate one is how the two came
          apart.

          The default `ubuntu-latest` is a MOVING ALIAS and is fine for an
          unscored lane.

          §15.3 takes the label as given: the comparability key records the
          runner_image_label a run was dispatched under, and QC12 compares it
          against what each bucket observed. A digest-pinned image was once
          required of a scored arm, on the reasoning that two arms scheduled
          through `ubuntu-latest` may execute on two different physical images
          while claiming one identity. That is true and it is a STATED
          LIMITATION of a mutable label, not a requirement: §3 draws a
          trusted-CI boundary, and nothing inside a run can compare the
          executing runner with the declared one in any case.
        type: string
        default: ubuntu-latest
      cache-declaration-json:
        description: >-
          The canonical cache declaration of §10.5.0 as CONTENT. A pathname
          cannot cross the workflow-call boundary: it is only a string inside
          the called workflow, and the two share no filesystem (§10.5.2 hop 0).
        type: string
        default: ""
      cache-declaration-digest-expected:
        description: >-
          Expected SHA-256 of that content, consumed once at §10.5.2 step 0c
          and nowhere else. It is a distinct name from the plan job's
          `cache-declaration-digest` OUTPUT, which is produced over the bytes
          the plan job verified; matrix jobs consume the output only.
        type: string
        default: ""
      dependency-cache-producer:
        description: '`none`, `action` or `caller` — §10.5.3''s wire representation.'
        type: string
        default: ""
      dependency-cache-matched-key:
        description: >-
          The caller's restore matched key, possibly empty. Required (possibly
          empty) iff the producer is `caller`.
        type: string
        default: ""
      dependency-cache-hit:
        description: >-
          The caller's restore result, `true` or `false`. Empty is NOT false:
          an empty matched key with a false hit is a caller-owned miss, while
          an empty matched key with no hit is absent producer data.
        type: string
        default: ""
      candidate-sha:
        description: 'The testbucket commit the executing binary was built from (AD-10, QC15).'
        type: string
        default: ""
      workload-commit:
        description: 'The consumer checkout this run executes against (AD-10, QC15).'
        type: string
        default: ""
      wall-observations-dir:
        description: 'Directory the record job hands to `ingest --wall-observations` (§14.2).'
        type: string
        default: ""
      campaign-config-json:
        description: >-
          The frozen §19.9a campaign config as content. Required iff the
          ingested set contains a scored or pilot row.
        type: string
        default: ""
      campaign-config-digest-expected:
        description: >-
          Expected SHA-256 of that content. §19.9c-1 verifies job-locally and
          fails BEFORE invoking `ingest`; the two perturbations fail
          independently.
        type: string
        default: ""
    outputs:
      cache-declaration-json:
        description: >-
          The canonical declaration bytes the plan job verified, re-exposed so
          a caller composing this workflow can see exactly what every bucket
          verified against.
        value: ${{ jobs.plan.outputs.cache-declaration-json }}
      cache-declaration-digest:
        description: 'SHA-256 over those same bytes (§10.5.2 step 2).'
        value: ${{ jobs.plan.outputs.cache-declaration-digest }}

jobs:
  # 1/3 — PLAN. Cheap, and the gate for everything downstream.
  plan:
    runs-on: ${{ inputs.runs-on-label }}
    # Checkout, the timing-store cache and same-run artifacts. It never reads
    # the Actions API, so `actions` stays none.
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      # §10.5.2 step 2: the declaration crosses the job boundary as CONTENT
      # plus a digest, because two jobs on two runners share no filesystem and
      # a pathname would transport nothing.
      cache-declaration-json: ${{ steps.plan.outputs.cache-declaration-json }}
      cache-declaration-digest: ${{ steps.plan.outputs.cache-declaration-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go is needed for the Go adapter AND for a local testbucket build (which
      # the plan action always does when version==local), regardless of adapter.
      - name: Set up Go
        if: inputs.runner == 'go' || inputs.testbucket-version == 'local'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Set up Node
        if: inputs.runner == 'vitest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install test dependencies
        if: inputs.runner == 'vitest'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Restore the timing store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-timings-${{ inputs.cache-scope }}-v1-${{ github.sha }}
          restore-keys: |
            testbucket-timings-${{ inputs.cache-scope }}-v1-

      # The attested-candidate-digest resolution that stood here is removed
      # with the authority model, together with the candidate delivery path it
      # fed: the installer now takes a released binary or builds from the
      # checked-out source, and names nothing it cannot verify against the
      # release's own checksums.

      - name: Materialize and verify the cache declaration
        id: cache-declaration
        if: inputs.cache-declaration-json != ''
        shell: bash
        env:
          TB_DECL_JSON: ${{ inputs.cache-declaration-json }}
          TB_DECL_EXPECTED: ${{ inputs.cache-declaration-digest-expected }}
        run: |
          set -euo pipefail
          if [ -z "$TB_DECL_EXPECTED" ]; then
            echo "cache-declaration-json supplied without cache-declaration-digest-expected" >&2
            exit 1
          fi
          dest="${{ runner.temp }}/cache-declaration.json"
          # printf, not echo: the declaration is canonical single-line JSON and
          # a shell that expanded escapes would change the very bytes the
          # digest is taken over.
          printf '%s' "$TB_DECL_JSON" > "$dest"
          actual=$(sha256sum "$dest" | cut -d' ' -f1)
          if [ "$actual" != "$TB_DECL_EXPECTED" ]; then
            echo "cache declaration digest mismatch: materialized $actual, expected $TB_DECL_EXPECTED" >&2
            exit 1
          fi
          echo "file=$dest" >> "$GITHUB_OUTPUT"

      - name: Plan the buckets
        id: plan
        uses: $/.github/actions/plan
        with:
          est-basis: ${{ inputs.est-basis }}
          scored: ${{ inputs.scored }}
          same-repository-workload: ${{ inputs.same-repository-workload }}
          runner-class: ${{ inputs.runner-class }}
          runs-on-label: ${{ inputs.runs-on-label }}
          cache-declaration-file: ${{ steps.cache-declaration.outputs.file }}
          candidate-sha: ${{ inputs.candidate-sha }}
          workload-commit: ${{ inputs.workload-commit }}
          runner: ${{ inputs.runner }}
          k: ${{ inputs.k }}
          count: ${{ inputs.count }}
          file-parallelism: ${{ inputs.file-parallelism }}
          store-path: ${{ runner.temp }}/testbucket-store/test-timings.json
          events-dir: /tmp/testbucket-events
          shard-plan: ${{ runner.temp }}/shard-plan.json
          version: ${{ inputs.testbucket-version }}
          working-directory: ${{ inputs.working-directory }}
          vitest-command: ${{ inputs.runner == 'vitest' && inputs.test-command || '' }}
          node-prefixes: ${{ inputs.node-prefixes }}
          exclude-module: ${{ inputs.exclude-module }}
          setup-command: ${{ inputs.setup-command }}
          wall-time-dir: ${{ inputs.wall-time-dir }}
          # The frozen-bundle planner is removed, and its one-shot claim with
          # it: the matrix is derived by the ordinary planner from the live
          # discovery and the store, which is the only path there is. The
          # claim store, its authority attestation and the predeclared keys
          # that verified it constrained a planner that no longer exists.

      - name: Upload the shard plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbucket-shard-plan-${{ inputs.cache-scope }}
          path: ${{ runner.temp }}/shard-plan.json
          if-no-files-found: warn
          retention-days: 14

  # 2/3 — TEST. One job per bucket, each running only its own slice.
  test:
    needs: plan
    runs-on: ${{ inputs.runs-on-label }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # Also for a MEASURED bucket built from source: the wrapper is
        # installed below, and `local` means `go build`.
        if: inputs.runner == 'go' || (inputs.wall-time-dir != '' && inputs.testbucket-version == 'local')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Set up Node
        if: inputs.runner == 'vitest' || matrix.needs_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install test dependencies
        if: inputs.runner == 'vitest'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      # The plan this bucket was fanned out from. It is what the coverage
      # audit compares this bucket's events against: a wall-time envelope records how
      # long something took and can never record what it skipped.
      # §10.5.2 step 3. Each matrix job writes the plan job's published bytes
      # to its OWN job-local file; run-bucket then re-verifies the digest and
      # fails the job before any bucket script starts if a byte moved. The path
      # is job-local by construction and is never claimed to be shared.
      - name: Materialize the cache declaration
        id: bucket-cache-declaration
        if: needs.plan.outputs.cache-declaration-json != ''
        shell: bash
        env:
          TB_DECL_JSON: ${{ needs.plan.outputs.cache-declaration-json }}
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/cache-declaration.json"
          printf '%s' "$TB_DECL_JSON" > "$dest"
          echo "file=$dest" >> "$GITHUB_OUTPUT"

      - name: Download the shard plan
        if: inputs.wall-time-dir != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testbucket-shard-plan-${{ inputs.cache-scope }}
          path: ${{ runner.temp }}/testbucket-plan

      # The frozen-plan pre-flight that stood here is removed with the Stage-1/
      # Stage-2 model: it re-planned from a signed bundle and required the
      # result to reproduce an issued receipt before the envelope opened. There
      # is no bundle, no receipt and no protected authority to approve them, and
      # §21 deletes the action.

      - name: Install testbucket for the measured action
        if: inputs.wall-time-dir != ''
        uses: $/.github/actions/install
        with:
          version: ${{ inputs.testbucket-version }}

      - name: Run bucket ${{ matrix.bucket }}
        id: run-bucket
        # WHAT THE BUCKET BANNER'S NUMBER MEANS. §16.4: under `reporter` the
        # estimate is a reporter-work sum, under `wall` it is the model's
        # predicted action interval. The component map gives run-bucket no
        # `est-basis` input, and a composite step inherits the job environment,
        # so the meaning travels here rather than the map being amended.
        env:
          TB_EST_BASIS: ${{ matrix.est_basis }}
        uses: $/.github/actions/run-bucket
        with:
          runner: ${{ inputs.runner }}
          script: ${{ matrix.script }}
          name: ${{ matrix.name }}
          # THE SUITE NAMESPACE, carried so the observation this bucket uploads
          # is addressable by THIS call's record job and by no other. Bucket
          # names are per-suite and repeat across suites; the scope is the one
          # value here that does not.
          cache-scope: ${{ inputs.cache-scope }}
          # §10.5.2 step 3: the bytes come from the PLAN JOB'S OUTPUTS, never
          # from the caller inputs — exactly one value governs every bucket job
          # of a run, and a bucket wired to the caller would reintroduce the
          # unbound second source the transport repair removed.
          runs-on-label: ${{ inputs.runs-on-label }}
          cache-declaration-file: ${{ steps.bucket-cache-declaration.outputs.file }}
          cache-declaration-digest: ${{ needs.plan.outputs.cache-declaration-digest }}
          dependency-cache-producer: ${{ inputs.dependency-cache-producer }}
          dependency-cache-matched-key: ${{ inputs.dependency-cache-matched-key }}
          dependency-cache-hit: ${{ inputs.dependency-cache-hit }}
          candidate-sha: ${{ inputs.candidate-sha }}
          workload-commit: ${{ inputs.workload-commit }}
          # THE PLAN THIS BUCKET WAS FANNED OUT FROM. The job downloaded it and
          # then did not pass it, so the action declared `shard-plan` and
          # referenced it nowhere -- which left the observation assembly with no
          # plan to copy the profile block from, and QC6 with no rendered
          # invocations to compare the measured ones against.
          shard-plan: ${{ inputs.wall-time-dir != '' && format('{0}/testbucket-plan/shard-plan.json', runner.temp) || '' }}
          est-seconds: ${{ matrix.est_seconds }}
          events-dir: /tmp/testbucket-events
          version: ${{ inputs.testbucket-version }}
          working-directory: ${{ inputs.working-directory }}
          setup-command: ${{ inputs.setup-command }}
          wall-time-dir: ${{ inputs.wall-time-dir }}
          campaign-id: ${{ inputs.campaign-id }}

      # Verification is its OWN action, run after run-bucket rather than inside
      # it. The contract puts AT_end after the final action epilogue, so a
      # verification step inside the run-bucket action would be action-owned
      # work after the interval that claims to contain it.
      - name: Verify bucket ${{ matrix.bucket }}
        if: always() && inputs.wall-time-dir != ''
        uses: $/.github/actions/verify-wall
        with:
          wall-time-dir: ${{ inputs.wall-time-dir }}
          version: ${{ inputs.testbucket-version }}
          # The authorised plan and the events it produced. Without them the
          # verifier can say the measurement was well formed and nothing more:
          # a script that skipped half its targets produces a shorter,
          # perfectly well-formed envelope, and no wall-time record can show
          # what was never run.
          runner: ${{ inputs.runner }}
          shard-plan-file: ${{ inputs.wall-time-dir != '' && format('{0}/testbucket-plan/shard-plan.json', runner.temp) || '' }}
          events-dir: /tmp/testbucket-events
          # THE SAME DIRECTORY THE PLAN AND BUCKET RAN IN. A rendered
          # invocation's `dir` is relative to it — Vitest's is `.` — and §13.1's
          # identity is the ABSOLUTE directory that resolves to. Verifying from
          # the repository root resolved it against the wrong base and failed a
          # correct nested run on cwd identity.
          working-directory: ${{ inputs.working-directory }}

      # The raw records ARE the evidence: the predictor update reads them, and
      # a row whose records were discarded with the runner cannot be
      # re-verified by anyone.
      - name: Upload the wall-time records
        if: always() && inputs.wall-time-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbucket-wall-${{ inputs.cache-scope }}-bucket-${{ matrix.bucket }}
          path: ${{ inputs.wall-time-dir }}
          if-no-files-found: warn
          retention-days: 90

      - name: Upload timing events
        # if: always() so a red bucket still contributes what it measured;
        # ingest drops a failed unit's weight and keeps the rest.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbucket-events-${{ inputs.cache-scope }}-bucket-${{ matrix.bucket }}
          path: /tmp/testbucket-events/
          if-no-files-found: warn
          retention-days: 7

  # 3/3 — RECORD. Default-branch push only. Folds the measured timings back in.
  record:
    needs: [plan, test]
    # !cancelled() rather than always(): record what a red run measured, but not
    # a cancelled one whose artifacts are arbitrary partial captures. Only the
    # consumer's default branch is authoritative for the shared store.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ inputs.runs-on-label }}
    # Checkout, same-run artifacts and the timing-store cache. The store is
    # written back through the cache, not through the repository, so `contents`
    # stays read and nothing here needs the Actions API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go is needed for the Go adapter AND for a local testbucket build (which
      # the record action always does when version==local), regardless of adapter.
      - name: Set up Go
        if: inputs.runner == 'go' || inputs.testbucket-version == 'local'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Set up Node
        if: inputs.runner == 'vitest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install test dependencies
        if: inputs.runner == 'vitest'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Download timing events
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: testbucket-events-${{ inputs.cache-scope }}-bucket-*
          merge-multiple: true
          path: /tmp/testbucket-events

      - name: Download the shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testbucket-shard-plan-${{ inputs.cache-scope }}
          path: ${{ runner.temp }}/plan

      # THE OBSERVATIONS THE MEASURED BUCKETS PRODUCED.
      #
      # This download is what closes the loop: without it the record job has
      # nothing to ingest and no measured bucket can ever change a later plan.
      #
      # `merge-multiple: true` is load-bearing. With it false, several matching
      # artifacts land under one subdirectory EACH, and the reader lists a
      # single level — so ingest found nothing, reported "0 of 0 observations",
      # exited 0 and saved the reporter update. Learning silently from no rows
      # is the worst of the three possible outcomes, because it looks like the
      # other two.
      #
      # Merging is only safe because each bucket names its own file, which is
      # why the assembler writes `observation-<scope>-<bucket>.json` rather
      # than one fixed name every bucket would overwrite.
      #
      # AND THE SELECTION IS SCOPED, for the same reason the store, the plan
      # and the event bundles above are. This pattern used to be
      # `testbucket-wall-obs-*-<run>-<attempt>`, which is every measured
      # suite's observation in the run: two calls of this workflow with
      # different cache scopes both fan out a `bucket-0`, so each record job
      # ingested the other's rows against its own plan. The wildcard now sits
      # after fixed text that the other suite's names cannot reproduce.
      - name: Download the wall observations
        if: inputs.wall-time-dir != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: testbucket-wall-obs-${{ inputs.cache-scope }}-run-${{ github.run_id }}-${{ github.run_attempt }}-bucket-*
          merge-multiple: true
          path: ${{ runner.temp }}/wall-observations

      - name: Restore the previous timing store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-timings-${{ inputs.cache-scope }}-v1-${{ github.sha }}
          restore-keys: |
            testbucket-timings-${{ inputs.cache-scope }}-v1-

      - name: Audit and record the run
        # QC12's plan-side label reaches `ingest` through the job environment:
        # a composite step inherits it, and the component map does not give the
        # record action an input for it. The map decides the interface; the
        # wiring adapts.
        env:
          TB_RUNS_ON_LABEL: ${{ inputs.runs-on-label }}
        uses: $/.github/actions/record
        with:
          # The directory the download above left, when this run measured;
          # otherwise whatever the caller supplied, which is how a consumer
          # ingests observations produced somewhere else.
          wall-observations-dir: ${{ inputs.wall-time-dir != '' && format('{0}/wall-observations', runner.temp) || inputs.wall-observations-dir }}
          campaign-config-json: ${{ inputs.campaign-config-json }}
          campaign-config-digest-expected: ${{ inputs.campaign-config-digest-expected }}
          runner: ${{ inputs.runner }}
          k: ${{ inputs.k }}
          count: ${{ inputs.count }}
          store-path: ${{ runner.temp }}/testbucket-store/test-timings.json
          events-dir: /tmp/testbucket-events
          shard-plan: ${{ runner.temp }}/plan/shard-plan.json
          version: ${{ inputs.testbucket-version }}
          working-directory: ${{ inputs.working-directory }}
          vitest-command: ${{ inputs.runner == 'vitest' && inputs.test-command || '' }}
          exclude-module: ${{ inputs.exclude-module }}

      - name: Save the timing store
        # Writes on a new default-branch commit; on a same-SHA re-run the entry
        # already exists and the action warns instead of overwriting, keeping the
        # split deterministic for a given SHA.
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testbucket-store
          key: testbucket-timings-${{ inputs.cache-scope }}-v1-${{ github.sha }}

      - name: Upload the timing store
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbucket-timing-store-${{ inputs.cache-scope }}
          path: ${{ runner.temp }}/testbucket-store/test-timings.json
          if-no-files-found: warn
          retention-days: 30
