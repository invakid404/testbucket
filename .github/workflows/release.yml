name: Release

# Cut a release from a version tag. Pushing `vX.Y.Z` builds the cross-platform
# CLI binaries (linux/darwin x amd64/arm64) with goreleaser, publishes a GitHub
# Release with the tar.gz archives + a checksums file, and points the
# `v<major>` alias tag at the HIGHEST stable release of that major so consumers
# can pin the reusable actions at that alias — the standard convention. While
# this project is pre-1.0 that alias is `v0`, which is what every action's
# `version` input defaults to.
#
# Validate the build WITHOUT publishing at any time:
#   goreleaser release --snapshot --clean

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One shared group (NOT keyed by ref) so releases serialise. queue: max lets ALL
# pending releases wait their turn (the default `single` keeps only one pending,
# so a third push would cancel a queued release before it ever built binaries);
# cancel-in-progress: false never kills a publish midway. Ordering across runs is
# still not guaranteed, so the alias job converges on the highest PUBLISHED
# release rather than trusting completion order. (queue: max is incompatible with
# cancel-in-progress: true, not with false.)
concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # goreleaser needs the full history and all tags for the version and
          # changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.0"

      # THE CAMPAIGN GATE. The frozen acceptance contract prohibits release
      # until an authenticated five-pair / ten-run / eighty-action-row campaign
      # across at least three UTC dates has passed, assembled from eligible
      # verifier verdicts. Without this step the rule lived only in documents,
      # and any `v*` tag push published a release regardless.
      #
      # It fails CLOSED: absent evidence, unreadable evidence and a campaign
      # whose gates did not pass are all refusals. `wall campaign --index`
      # assembles its population from signed verdicts and exits non-zero unless
      # every frozen gate passes, so this delegates the decision to the same
      # code a validator runs rather than reimplementing it here.
      #
      # It is also bound to THIS release. The gate used to run the evaluator
      # with no expected delivery at all, and the evaluator only asked each arm
      # to agree with itself — so a valid campaign committed once at
      # campaign/index.json authorised every later tag, and the binary built
      # here was never compared to the one the campaign was measured with.
      # `--release-sha` and `--release-binary` supply both, and the
      # release-binding gate does not pass without them.
      - name: Refuse a release with no passing campaign
        env:
          # Path, inside the tagged tree, to the campaign index naming the
          # five pairs and their per-bucket verdicts. There is deliberately no
          # override and no skip: a release that could opt out of this gate
          # would not be gated.
          TB_CAMPAIGN_INDEX: campaign/index.json
          TB_CAMPAIGN_AUTHORITY: ewj2-campaign
          TB_CAMPAIGN_AUTHORITY_KEY: ${{ vars.TB_CAMPAIGN_AUTHORITY_KEY }}
          # The immutable commit this tag resolves to. github.sha on a tag push
          # is the tagged commit, and it is read here rather than derived from
          # the tag NAME: a tag is descriptive metadata that can be moved, and
          # a moved tag must not inherit another commit's evidence.
          TB_RELEASE_SHA: ${{ github.sha }}
          # The digest of the binary asset the campaign's candidate arms were
          # actually delivered with, declared inside the tagged tree beside the
          # index it belongs to. It is a committed, reviewed file rather than a
          # repository variable so it is immutable at the tag, and rather than
          # the digest of the binary built two lines below because that one is
          # an ordinary `go build` of the gate's own tool, not the published
          # release artifact.
          TB_CAMPAIGN_BINARY_DIGEST_FILE: campaign/release-binary.sha256
        run: |
          set -euo pipefail
          if [ ! -f "$TB_CAMPAIGN_INDEX" ]; then
            echo "REFUSED: no campaign index at $TB_CAMPAIGN_INDEX." >&2
            echo "The frozen acceptance contract prohibits a release until an authenticated" >&2
            echo "five-pair / ten-run / eighty-action-row campaign across at least three UTC" >&2
            echo "dates has passed. Tagging does not satisfy that rule; producing the evidence does." >&2
            exit 1
          fi
          if [ -z "$TB_CAMPAIGN_AUTHORITY_KEY" ]; then
            echo "REFUSED: no predeclared campaign authority key (repository variable TB_CAMPAIGN_AUTHORITY_KEY)." >&2
            echo "A campaign verified against whatever signed it accepts any self-generated key." >&2
            exit 1
          fi
          if [ ! -f "$TB_CAMPAIGN_BINARY_DIGEST_FILE" ]; then
            echo "REFUSED: no delivered-binary digest at $TB_CAMPAIGN_BINARY_DIGEST_FILE." >&2
            echo "A campaign that bound a binary nobody compared authorises an asset it never saw." >&2
            exit 1
          fi
          TB_RELEASE_BINARY_DIGEST="$(tr -d ' \t\n\r' < "$TB_CAMPAIGN_BINARY_DIGEST_FILE")"
          if [ -z "$TB_RELEASE_BINARY_DIGEST" ]; then
            echo "REFUSED: $TB_CAMPAIGN_BINARY_DIGEST_FILE is empty." >&2
            exit 1
          fi
          go build -o "$RUNNER_TEMP/testbucket" ./cmd/testbucket
          # Non-zero unless every frozen gate passes over the full population
          # AND every candidate arm of that population reviewed, was released
          # from, and delivered exactly this commit and this binary.
          "$RUNNER_TEMP/testbucket" wall campaign \
            --index "$TB_CAMPAIGN_INDEX" \
            --authority "$TB_CAMPAIGN_AUTHORITY" \
            --authority-key "$TB_CAMPAIGN_AUTHORITY_KEY" \
            --release-sha "$TB_RELEASE_SHA" \
            --release-binary-digest "$TB_RELEASE_BINARY_DIGEST"
          echo "campaign gate: the frozen decision rule passes over the retained population,"
          echo "and that population authorises exactly $TB_RELEASE_SHA"


      - name: Run goreleaser
        # Pinned to a reviewed commit SHA (third-party code with a write token);
        # bump via an explicit PR. goreleaser itself is pinned to an exact
        # version in the same spirit.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "2.18.0"
          # --clean is safe to re-run: replace_existing_artifacts is enabled in
          # .goreleaser.yaml, so a rerun after a transient failure replaces the
          # assets instead of failing with `already_exists`.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The major alias (v1) is a SEPARATE, independently-retryable job: if the
  # release published but this failed transiently, rerunning just recomputes and
  # re-points — it never rebuilds or re-uploads.
  alias:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Point v<major> at the highest stable release of that major
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only a plain stable vMAJOR.MINOR.PATCH tag moves an alias; a
          # pre-release (v1.2.3-rc.1) or a bare major tag does not.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $TAG is not a stable release tag; leaving aliases untouched"
            exit 0
          fi
          major="${TAG%%.*}"   # v1

          compute_target() {
            # The highest stable vMAJOR.*.* release that has actually PUBLISHED —
            # not the highest git TAG. A tag ref exists the instant it is pushed,
            # before its release finishes; scanning tags could point the alias at
            # a release that has no downloadable binaries (or that later fails).
            # A published, non-prerelease, non-draft release always has artifacts,
            # and whichever release runs last converges the alias on the newest.
            git fetch --force --tags origin >/dev/null 2>&1
            local highest
            highest=$(gh release list --repo "$GITHUB_REPOSITORY" \
                --json tagName,isDraft,isPrerelease --limit 200 \
              | jq -r '.[] | select(.isDraft==false and .isPrerelease==false) | .tagName' \
              | grep -E "^${major}\.[0-9]+\.[0-9]+$" \
              | sort -V | tail -n1)
            if [ -z "$highest" ]; then
              echo "no published stable ${major}.*.* release found" >&2
              return 1
            fi
            echo "$highest"
          }

          for attempt in 1 2 3 4 5; do
            highest=$(compute_target)
            target=$(git rev-list -n1 "$highest")
            current=$(git ls-remote origin "refs/tags/${major}" | awk '{print $1}')
            echo "attempt $attempt: ${major} -> ${highest} (${target}); remote currently ${current:-<none>}"

            if [ "$current" = "$target" ]; then
              echo "alias ${major} already at the highest release"
              exit 0
            fi

            git tag -f "$major" "$target"
            # Compare-and-swap: the push is rejected if the remote alias moved
            # since we read it (a concurrent release), so we refetch and retry
            # rather than clobber a newer value.
            if [ -n "$current" ]; then
              lease="--force-with-lease=refs/tags/${major}:${current}"
            else
              lease="--force-with-lease=refs/tags/${major}:"
            fi
            if git push origin "refs/tags/${major}" $lease; then
              echo "alias ${major} -> ${highest}"
              exit 0
            fi
            echo "push lost the race; retrying"
            sleep 3
          done
          echo "failed to update the ${major} alias after retries" >&2
          exit 1
