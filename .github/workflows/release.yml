name: Release

# Cut a release from a version tag. Pushing `vX.Y.Z` builds the cross-platform
# CLI binaries (linux/darwin x amd64/arm64) with goreleaser, publishes a GitHub
# Release with the tar.gz archives + a checksums file, and points the
# `v<major>` alias tag (e.g. v1) at the HIGHEST stable release of that major so
# consumers can pin the reusable actions at @v1 — the standard convention.
#
# Validate the build WITHOUT publishing at any time:
#   goreleaser release --snapshot --clean

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One shared group (NOT keyed by ref) so releases serialise. queue: max lets ALL
# pending releases wait their turn (the default `single` keeps only one pending,
# so a third push would cancel a queued release before it ever built binaries);
# cancel-in-progress: false never kills a publish midway. Ordering across runs is
# still not guaranteed, so the alias job converges on the highest PUBLISHED
# release rather than trusting completion order. (queue: max is incompatible with
# cancel-in-progress: true, not with false.)
concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          # goreleaser needs the full history and all tags for the version and
          # changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: "1.27"

      - name: Run goreleaser
        # Pinned to a reviewed commit SHA (third-party code with a write token);
        # bump via an explicit PR. goreleaser itself is pinned to an exact
        # version in the same spirit.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "2.18.0"
          # --clean is safe to re-run: replace_existing_artifacts is enabled in
          # .goreleaser.yaml, so a rerun after a transient failure replaces the
          # assets instead of failing with `already_exists`.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The major alias (v1) is a SEPARATE, independently-retryable job: if the
  # release published but this failed transiently, rerunning just recomputes and
  # re-points — it never rebuilds or re-uploads.
  alias:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Point v<major> at the highest stable release of that major
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only a plain stable vMAJOR.MINOR.PATCH tag moves an alias; a
          # pre-release (v1.2.3-rc.1) or a bare major tag does not.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $TAG is not a stable release tag; leaving aliases untouched"
            exit 0
          fi
          major="${TAG%%.*}"   # v1

          compute_target() {
            # The highest stable vMAJOR.*.* release that has actually PUBLISHED —
            # not the highest git TAG. A tag ref exists the instant it is pushed,
            # before its release finishes; scanning tags could point the alias at
            # a release that has no downloadable binaries (or that later fails).
            # A published, non-prerelease, non-draft release always has artifacts,
            # and whichever release runs last converges the alias on the newest.
            git fetch --force --tags origin >/dev/null 2>&1
            local highest
            highest=$(gh release list --repo "$GITHUB_REPOSITORY" \
                --json tagName,isDraft,isPrerelease --limit 200 \
              | jq -r '.[] | select(.isDraft==false and .isPrerelease==false) | .tagName' \
              | grep -E "^${major}\.[0-9]+\.[0-9]+$" \
              | sort -V | tail -n1)
            if [ -z "$highest" ]; then
              echo "no published stable ${major}.*.* release found" >&2
              return 1
            fi
            echo "$highest"
          }

          for attempt in 1 2 3 4 5; do
            highest=$(compute_target)
            target=$(git rev-list -n1 "$highest")
            current=$(git ls-remote origin "refs/tags/${major}" | awk '{print $1}')
            echo "attempt $attempt: ${major} -> ${highest} (${target}); remote currently ${current:-<none>}"

            if [ "$current" = "$target" ]; then
              echo "alias ${major} already at the highest release"
              exit 0
            fi

            git tag -f "$major" "$target"
            # Compare-and-swap: the push is rejected if the remote alias moved
            # since we read it (a concurrent release), so we refetch and retry
            # rather than clobber a newer value.
            if [ -n "$current" ]; then
              lease="--force-with-lease=refs/tags/${major}:${current}"
            else
              lease="--force-with-lease=refs/tags/${major}:"
            fi
            if git push origin "refs/tags/${major}" $lease; then
              echo "alias ${major} -> ${highest}"
              exit 0
            fi
            echo "push lost the race; retrying"
            sleep 3
          done
          echo "failed to update the ${major} alias after retries" >&2
          exit 1
